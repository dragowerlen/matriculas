<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123832">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MATRÍCULAS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>MATRÍCULAS</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F1EA;
    --surface: #FFFFFF;
    --ink: #171A1C;
    --ink-soft: #63676C;
    --ink-faint: #9A9D9F;
    --border: #E1DED2;
    --accent: #123832;
    --accent-2: #1B5A4F;
    --accent-soft: #E3ECE9;
    --whatsapp: #22C35E;
    --danger: #A23B2E;
    --danger-soft: #F5E3DF;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(23,26,28,.04), 0 8px 24px -12px rgba(23,26,28,.18);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body{ margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  #app{ max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; position: relative; }
  h1,h2,h3{ font-family: 'Space Grotesk', sans-serif; margin: 0; letter-spacing: -0.01em; }
  button{ font-family: inherit; cursor: pointer; }
  input, select, textarea{ font-family: inherit; font-size: 15px; }

  /* Cabeçalho inteiro (título, busca, botões, filtros) gruda como um
     bloco único ao rolar a tela — evita a sobreposição bagunçada de
     ter vários elementos "sticky" separados competindo pela mesma
     posição, que fazia partes do conteúdo sumirem atrás de outras. */
  .cabecalho-fixo{ position: sticky; top: 0; z-index: 20; background: var(--bg); }

  .topbar{ background: var(--accent); color: #fff; padding: 16px 18px 14px; }
  .topbar-linha{ display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .topbar-marca{ display: flex; align-items: center; gap: 9px; }
  .topbar-logo{ width: 56px; height: 56px; flex-shrink: 0; }
  .topbar h1{ font-size: 19px; font-weight: 600; color: #fff; }
  .card-linha-resumo{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-faint); margin-top:2px; }
  .card-linha-resumo-k{ font-weight:600; flex-shrink:0; }
  .card-linha-resumo-v{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .status-comercial-inline, .status-comportamental-inline{
    border:1px solid #DAD5C8; border-radius:8px; padding:3px 6px; font-size:12.5px;
    background:#fff; color:var(--ink); max-width:160px;
  }
  .status-comercial-inline.salvando, .status-comportamental-inline.salvando{ opacity:.5; }
  .dia-semana-agenda{ font-size:12px; color:var(--ink-faint); margin-top:4px; font-weight:600; }
  .mensagem-whatsapp-box{ background:#F7F5EF; border:1px solid #E5E0D2; border-radius:12px; padding:12px; }
  .mensagem-whatsapp-titulo{ font-weight:600; font-size:13.5px; margin-bottom:4px; }
  .mensagem-item{ background:#fff; border:1.3px solid #E5E0D2; border-radius:10px; padding:8px; margin-bottom:8px; }
  .mensagem-item.padrao{ border-color:var(--accent); }
  .mensagem-item-topo{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .mensagem-item-radio{ flex-shrink:0; width:16px; height:16px; accent-color:var(--accent); }
  .mensagem-item-nome{ flex:1; border:none; background:none; font-size:13px; font-weight:600; padding:2px 0; }
  .mensagem-item-excluir{
    flex-shrink:0; width:22px; height:22px; border-radius:50%; border:none;
    background:#EFE9DA; color:var(--ink-soft); font-size:12px;
  }
  .mensagem-item-excluir:hover{ background:#E4453A; color:#fff; }
  .mensagem-item-texto{
    width:100%; box-sizing:border-box; border:1px solid #DAD5C8; border-radius:8px;
    padding:8px 10px; font-size:13px; font-family:inherit; resize:vertical;
  }
  .autocomplete-tags{
    position:absolute; left:0; right:0; bottom:calc(100% + 4px); z-index:20;
    background:#fff; border:1.3px solid var(--border); border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.15); overflow:hidden;
  }
  .autocomplete-tag-item{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:9px 10px; font-size:12.5px; color:var(--ink); border-bottom:1px solid var(--border);
  }
  .autocomplete-tag-item:last-child{ border-bottom:none; }
  .autocomplete-tag-item:hover{ background:var(--bg); }
  .campo-com-microfone{ display:flex; align-items:flex-start; gap:6px; }
  .campo-com-microfone textarea{ flex:1; min-width:0; }
  .btn-microfone{
    flex-shrink:0; width:34px; height:34px; border-radius:50%; border:1px solid #DAD5C8;
    background:#fff; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin-top:2px;
  }
  .btn-microfone.ouvindo{ background:#E4453A; border-color:#E4453A; color:#fff; animation: pulsarMicrofone 1.1s infinite; }
  @keyframes pulsarMicrofone{ 0%{ box-shadow:0 0 0 0 rgba(228,69,58,.5); } 100%{ box-shadow:0 0 0 8px rgba(228,69,58,0); } }
  .gerenciar-lista-campo{ margin-bottom: 14px; }
  .gerenciar-lista-titulo{ font-weight:700; font-size:12.5px; margin-bottom:6px; color:#E4453A; }
  .chips-opcoes{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chip-opcao{
    display:inline-flex; align-items:center; gap:5px; background:#fff; border:1px solid #DAD5C8;
    border-radius:999px; padding:4px 4px 4px 10px; font-size:12px; color:var(--ink);
  }
  .chip-opcao-excluir{
    border:none; background:#EFE9DA; color:var(--ink-soft); width:18px; height:18px; border-radius:50%;
    font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .chip-opcao-excluir:hover{ background:#E4453A; color:#fff; }
  .add-opcao-row{ display:flex; gap:6px; }
  .add-opcao-row input{ flex:1; min-width:0; border:1px solid #DAD5C8; border-radius:8px; padding:6px 8px; font-size:12.5px; }
  .substituir-lote-box{ margin-top:10px; padding-top:10px; border-top:1px dashed #DAD5C8; }
  .substituir-lote-titulo{ font-weight:600; font-size:12.5px; margin-bottom:2px; }
  .substituir-lote-selects{ display:flex; align-items:center; gap:6px; }
  .substituir-lote-selects select{ flex:1; min-width:0; border:1px solid #DAD5C8; border-radius:8px; padding:6px 6px; font-size:12px; }
  .substituir-lote-seta{ flex-shrink:0; color:var(--ink-faint); font-size:14px; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center;
    z-index:999; padding:20px;
  }
  .modal-caixa{ background:#fff; border-radius:14px; padding:18px; max-width:360px; width:100%; }
  .modal-caixa h3{ margin:0 0 8px; font-size:16px; }
  .modal-caixa p{ font-size:13px; color:var(--ink-soft); line-height:1.4; margin:0 0 10px; }
  .modal-caixa select{ width:100%; border:1px solid #DAD5C8; border-radius:8px; padding:7px 8px; font-size:13px; margin-bottom:12px; }
  .modal-acoes{ display:flex; justify-content:flex-end; gap:8px; }
  .lista-preview-importacao{ display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; }
  .preview-importacao-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#F7F5EF; border:1px solid #E5E0D2; border-radius:10px; padding:7px 10px;
  }
  .preview-importacao-nome{ font-size:12.5px; font-weight:600; }
  .preview-importacao-tel{ font-size:11.5px; color:var(--ink-faint); }
  .preview-importacao-remover{
    flex-shrink:0; border:none; background:#EFE9DA; color:var(--ink-soft); width:22px; height:22px;
    border-radius:50%; font-size:12px; cursor:pointer;
  }
  .preview-importacao-remover:hover{ background:#E4453A; color:#fff; }
  .topbar .sub{ font-size: 12.5px; opacity: .78; margin-top: 4px; margin-left: 65px; }
  .btn-add{ width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; border: none; background: rgba(255,255,255,.18); color: #fff; font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .btn-add:active{ background: rgba(255,255,255,.3); }
  .btn-add svg{ width: 17px; height: 17px; }

  /* Caixa única de filtro (referidos, fuso, país, região, status, datas, buscar) */
  .filtros-box{ border: 1.4px solid var(--border); border-radius: var(--radius); padding: 12px; margin: 10px 14px 0; background: var(--surface); }

  .menu-topo-dot{ position:absolute; top:2px; right:2px; width:9px; height:9px; border-radius:50%; background:#E4453A; border:1.5px solid var(--accent); }
  .menu-topo-dropdown{
    position:absolute; top:calc(100% + 8px); right:0; z-index:40; min-width:200px;
    background:#fff; border-radius:var(--radius); box-shadow:0 8px 24px rgba(0,0,0,.18);
    padding:6px; display:flex; flex-direction:column; gap:2px;
  }
  .menu-topo-item{
    display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none;
    padding:10px 12px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:500; color:var(--ink);
    width:100%;
  }
  .menu-topo-item:active{ background:var(--bg); }
  .menu-topo-item.ativo{ background:var(--accent-soft); color:var(--accent); }
  .menu-topo-item svg{ width:17px; height:17px; flex-shrink:0; }

  .btn-icon-claro{
    width:32px; height:32px; flex-shrink:0; border-radius:50%; border:1.3px solid var(--border);
    background:var(--bg); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
  }
  .btn-icon-claro svg{ width:16px; height:16px; }
  .btn-icon-claro.ativo{ border-color:#E4453A; color:#E4453A; }
  .btn-icon-claro:disabled{ opacity:.4; }

  .filtros-valores-vazio{ color:var(--ink-faint); font-size:12.5px; padding:14px 4px; }

  .dropdown-filtro-inline{
    margin-top:8px; background:#fff; border:1.4px solid var(--border); border-radius:var(--radius-sm);
    box-shadow:0 2px 8px rgba(0,0,0,.06); max-height:280px; overflow-y:auto; padding:4px;
  }
  .dropdown-filtro-inline .item-categoria{
    display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
    background:none; border:none; padding:11px 10px; font-size:13px; border-radius:8px; color:var(--ink);
  }
  .dropdown-filtro-inline .item-categoria.ativa{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .dropdown-filtro-inline .item-categoria .n{ background:var(--accent); color:#fff; border-radius:999px; font-size:10px; padding:1px 6px; font-weight:600; }
  .dropdown-filtro-inline .check-row{ padding:9px 6px; font-size:13px; }
  .filter-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .filter-grid + .filter-grid{ margin-top: 8px; }
  .chip.grid{ width: 100%; justify-content: center; text-align: center; padding: 9px 6px; font-size: 12px; white-space: normal; line-height: 1.25; }
  .chip{ flex-shrink: 0; white-space: nowrap; background: var(--bg); border: 1.3px solid var(--border); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .chip.active{ background: var(--accent-soft); border-color: var(--accent-2); color: var(--accent); }
  .chip .n{ background: var(--accent); color: #fff; border-radius: 999px; font-size: 10.5px; padding: 1px 6px; font-weight: 600; }
  .chip.buscar{ background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.buscar.active-busca{ background: #8A6414; border-color: #8A6414; }
  .aviso-busca-ativa{ font-size: 12px; color: #8A6414; background: #FBEBC9; border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 10px; line-height: 1.4; }

  .busca-row{ margin-top: 8px; }
  .busca-row input{ width: 100%; padding: 10px 14px; border-radius: var(--radius-sm); border: 1.3px solid var(--border); background: var(--surface); font-size: 14px; }

  .result-count{ padding: 8px 18px 4px; font-size: 12.5px; color: var(--ink-faint); font-weight: 500; }

  .list{ padding: 6px 14px 40px; }
  #cardsWrap{ display: flex; flex-direction: column; gap: 10px; }
  .card{ background: var(--surface); border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow); }
  .card-header-row{ display: flex; align-items: center; gap: 10px; }
  .card-header-row .nome{ flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-header-actions{ display: flex; gap: 8px; flex-shrink: 0; }
  .card .tel{ font-size: 13px; color: var(--ink-soft); margin-top: 1px; }
  .filtro-badges-row{ display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .filtro-badge{ background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 9px; font-size: 10.5px; font-weight: 600; }
  .card .pills{ display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
  .pill{ font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
  .icon-btn{ width: 36px; height: 36px; border-radius: 50%; border: 1.3px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-btn.whatsapp{ background: var(--whatsapp); border-color: var(--whatsapp); }
  .icon-btn.info.active{ background: var(--accent-soft); border-color: var(--accent-2); color: var(--accent); }
  .icon-btn svg{ width: 18px; height: 18px; }
  .card-extra{ margin-top: 12px; padding-top: 12px; border-top: 1px solid #F0EEE6; }
  .detail-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 4px 14px; }
  .detail-grid .detail-field{ padding: 7px 0; }
  .duplicata-field{ background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; margin: 8px 0; }
  .input-nome-inline{ flex: 1; font-size: 15.5px; font-weight: 600; font-family: 'Space Grotesk', sans-serif; padding: 7px 9px; border: 1.3px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
  .input-tel-inline{ width: 100%; margin-top: 8px; padding: 8px 10px; border: 1.3px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 13px; }

  .empty-state{ text-align: center; padding: 60px 24px; color: var(--ink-faint); }
  .empty-state .big{ font-size: 40px; margin-bottom: 10px; }
  .loading{ text-align: center; padding: 40px; color: var(--ink-faint); font-size: 14px; }

  .sheet-backdrop{ position: fixed; inset: 0; background: rgba(17,20,21,.42); z-index: 40; display: none; }
  .sheet-backdrop.open{ display: block; }
  .sheet{ position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 520px; margin: 0 auto; background: var(--surface); border-radius: 20px 20px 0 0; max-height: 82vh; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .22s ease; }
  .sheet.open{ transform: translateY(0); }
  .sheet-handle{ width: 36px; height: 4px; background: var(--border); border-radius: 99px; margin: 10px auto 4px; }
  .sheet-header{ padding: 8px 20px 14px; border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .sheet-header h3{ font-size: 16.5px; }
  .sheet-header .close{ background: none; border: none; font-size: 20px; color: var(--ink-faint); padding: 4px; }
  .sheet-body{ padding: 10px 20px 16px; overflow-y: auto; }
  .sheet-footer{ padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); display: flex; gap: 10px; }

  .check-row{ display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid #F0EEE6; font-size: 14.5px; }
  .check-row input[type=checkbox]{ width: 19px; height: 19px; accent-color: var(--accent); flex-shrink:0; }
  .check-row label{ flex: 1; }
  .check-row .count{ color: var(--ink-faint); font-size: 12px; }

  .data-item{ display: flex; flex-direction: column; gap: 5px; padding: 6px 0; }
  .data-item label{ font-size: 12.5px; color: var(--ink-soft); font-weight: 500; }
  .data-item input[type=date]{ width: 100%; padding: 10px; border: 1.3px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 14px; color: var(--ink); }
  .busca-livre-row{ padding: 6px 0; position: relative; }
  .busca-livre-row input{ width: 100%; box-sizing: border-box; padding: 11px 40px 11px 14px; border-radius: var(--radius-sm); border: 1.3px solid var(--border); background: var(--bg); font-size: 14.5px; }
  .busca-livre-row #btnLimparBuscaX{
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; border: none; background: var(--border);
    color: var(--ink-soft); align-items: center; justify-content: center;
  }
  .busca-livre-row #btnLimparBuscaX svg{ width: 14px; height: 14px; }

  .btn{ border: none; border-radius: var(--radius-sm); padding: 12px 16px; font-weight: 600; font-size: 14px; flex: 1; text-align: center; }
  .btn.primary{ background: var(--accent); color: #fff; }
  .btn.ghost{ background: var(--accent-soft); color: var(--accent); }
  .btn.danger{ background: var(--danger-soft); color: var(--danger); }
  .btn[disabled]{ opacity: .55; }

  .detail-field{ padding: 11px 0; border-bottom: 1px solid #F0EEE6; }
  .detail-field .k{ font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); font-weight: 600; margin-bottom: 3px; }
  .detail-field .v{ font-size: 14.5px; color: var(--ink); white-space: pre-line; }
  .detail-field .v.empty{ color: var(--ink-faint); font-style: italic; }
  .detail-field input, .detail-field select, .detail-field textarea{ width: 100%; padding: 9px 10px; border: 1.3px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
  .detail-field textarea{ min-height: 70px; resize: vertical; }
  .detail-actions{ display: flex; gap: 8px; padding: 14px 0 4px; }
  .aviso-erro{ background: var(--danger-soft); color: var(--danger); font-size: 13px; padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 10px; }

  .toast{ position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13.5px; z-index: 60; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 85%; text-align:center; }

  /* ---------- Relatório ---------- */
  .relatorio-resumo{ text-align: center; padding: 6px 0 18px; }
  .relatorio-total{ font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 700; color: var(--accent); line-height: 1; }
  .relatorio-total-label{ font-size: 12.5px; color: var(--ink-faint); margin-top: 4px; }
  .relatorio-barras{ margin-top: 14px; display: flex; flex-direction: column; gap: 14px; }
  .relatorio-linha{ border-left: 4px solid transparent; padding-left: 10px; }
  .relatorio-linha-topo{ display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .relatorio-label{ font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .relatorio-valor{ font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .relatorio-pct{ font-weight: 500; color: var(--ink-faint); font-size: 12px; }
  .relatorio-barra-fundo{ background: var(--accent-soft); border-radius: 999px; height: 9px; overflow: hidden; }

  /* Gráfico do relatório (barra/pizza) */
  .grafico-controles{ margin-top: 16px; padding-top: 14px; border-top: 1px solid #F0EEE6; }
  .grafico-toggle{ display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .grafico-toggle input{ width: 18px; height: 18px; accent-color: var(--accent); }
  .grafico-opcoes{ margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
  .chip-toggle-group{ display: flex; gap: 8px; }

  mensagensWhatsapp: [],

/* Salva os filtros ativos no momento (a cada re-filtragem da lista),
   pra serem restaurados automaticamente ao reabrir/recarregar o app. */
function persistirFiltrosAtivos(){
  try{
    const paraSalvar = {
      filtros: {},
      filtrosData: { ...estado.filtrosData },
      busca: estado.busca
    };
    CAMPOS_FILTRO.forEach(f => {
      paraSalvar.filtros[f.chave] = Array.from(estado.filtros[f.chave]);
    });
    localStorage.setItem(CHAVE_FILTROS_SALVOS, JSON.stringify(paraSalvar));
  }catch(e){
    // se o navegador bloquear localStorage, simplesmente não persiste
  }
}

/* Restaura os filtros salvos da última vez, chamado uma vez ao abrir
   o app (antes do primeiro carregamento da lista). */
function restaurarFiltrosSalvos(){
  try{
    const bruto = localStorage.getItem(CHAVE_FILTROS_SALVOS);
    if(!bruto) return;
    const salvos = JSON.parse(bruto);

    if(salvos.filtros){
      CAMPOS_FILTRO.forEach(f => {
        const valores = salvos.filtros[f.chave];
        if(Array.isArray(valores) && valores.length > 0){
          estado.filtros[f.chave] = new Set(valores);
        }
      });
    }

    if(salvos.filtrosData){
      CAMPOS_FILTRO_DATA.forEach(f => {
        const salvo = salvos.filtrosData[f.chave];
        if(salvo && typeof salvo === "object"){
          estado.filtrosData[f.chave] = { de: salvo.de || "", ate: salvo.ate || "" };
        }
        // formato antigo (texto simples) é ignorado — o filtro começa limpo
      });
    }

    if(salvos.busca){
      estado.busca = salvos.busca;
    }
  }catch(e){
    // se der qualquer problema lendo o que estava salvo, ignora e
    // começa sem nenhum filtro ativo, sem quebrar o app
  }
}

function escapeAttr(v){
  return String(v === null || v === undefined ? "" : v)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* dd/MM/yyyy <-> yyyy-MM-dd (formato do <input type="date">) */
function brParaIso(brData){
  const m = String(brData || "").match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return "";
  return m[3] + "-" + m[2] + "-" + m[1];
}
function isoParaBr(isoData){
  const partes = String(isoData || "").split("-");
  if(partes.length !== 3) return "";
  return partes[2] + "/" + partes[1] + "/" + partes[0];
}

/* "dd/MM/yyyy HH:mm" <-> "yyyy-MM-ddTHH:mm" (formato do <input type="datetime-local">) */
function brDataHoraParaInputValue(brDataHora){
  const m = String(brDataHora || "").match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if(!m) return "";
  return m[3] + "-" + m[2] + "-" + m[1] + "T" + m[4] + ":" + m[5];
}

/* Sugestão padrão pro campo de agendamento: daqui a 1h, arredondado
   pros 15 minutos mais próximos. */
function sugestaoInputAgendamento(){
  const d = new Date(Date.now() + 60 * 60000);
  d.setMinutes(Math.ceil(d.getMinutes() / 15) * 15, 0, 0);
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

/* ============================================================
 * API
 * ============================================================ */
function reconstruirContatos(resposta){
  const campos = resposta.campos;
  const linhas = resposta.linhas;
  const abaConstante = resposta.aba || ABA_CONTATOS;
  const totalCampos = campos.length;
  const totalLinhas = linhas.length;
  const saida = new Array(totalLinhas);

  // Loop simples (não forEach/map) — mais rápido em V8 pra arrays
  // grandes como esse (dezenas de milhares de contatos), porque evita
  // a sobrecarga de criar uma closure por item.
  for(let i = 0; i < totalLinhas; i++){
    const linha = linhas[i];
    const obj = { aba: abaConstante };
    for(let j = 0; j < totalCampos; j++){
      obj[campos[j]] = linha[j];
    }
    saida[i] = obj;
  }

  return saida;
}

function mostrarToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

const MENSAGEM_WHATSAPP_PADRAO = "Oi {nome}, {periodo}! Aqui é o Drago da Wise Up!";

const TAGS_MENSAGEM_DISPONIVEIS = [
  { chave: "nome", rotulo: "{nome} — primeiro nome do contato" },

];

/* Carrega as mensagens do Supabase (sincronizadas entre todos os
   aparelhos) pra dentro de estado.mensagensWhatsapp. Se a tabela
   ainda estiver vazia mas existir alguma mensagem salva localmente
   nesse navegador (versão antiga, antes da sincronização existir),
   migra ela automaticamente pra não perder nada. */
async function carregarMensagensWhatsapp(){
  try{
    let lista = await apiListarMensagensWhatsapp();

    if(lista.length === 0){
      let textoAntigo = null;
      try{
        const bruto = localStorage.getItem("mensagensWhatsappLista");
        if(bruto){
          const antigas = JSON.parse(bruto);
          if(Array.isArray(antigas) && antigas.length > 0){
            for(const m of antigas){
              await apiCriarMensagemWhatsapp(m.nome || "Mensagem", m.texto || "", false);
            }
            lista = await apiListarMensagensWhatsapp();
          }
        }
      }catch(e){ /* sem nada salvo localmente — segue pro padrão abaixo */ }

      if(lista.length === 0){
        const criada = await apiCriarMensagemWhatsapp("Padrão", MENSAGEM_WHATSAPP_PADRAO, true);
        lista = [criada];
      }
    }

    if(!lista.some(m => m.padrao)) lista[0].padrao = true;

    estado.mensagensWhatsapp = lista;
  }catch(err){
    // Se der erro (sem internet na hora, por exemplo), usa uma mensagem
    // padrão só nessa sessão, sem travar o app.
    estado.mensagensWhatsapp = [{ id: null, nome: "Padrão", texto: MENSAGEM_WHATSAPP_PADRAO, padrao: true }];
  }
}

function obterMensagemWhatsappTemplate(){
  const lista = estado.mensagensWhatsapp || [];
  const msg = lista.find(m => m.padrao) || lista[0];
  return msg ? msg.texto : MENSAGEM_WHATSAPP_PADRAO;
}

async function definirMensagemPadrao(id){
  try{
    await apiDefinirMensagemWhatsappPadrao(id);
    estado.mensagensWhatsapp.forEach(m => { m.padrao = (m.id === id); });
  }catch(err){
    mostrarToast("Erro ao definir mensagem padrão: " + err.message);
  }
}

async function adicionarMensagemWhatsapp(){
  try{
    const criada = await apiCriarMensagemWhatsapp("Nova mensagem", "", false);
    estado.mensagensWhatsapp.push(criada);
  }catch(err){
    mostrarToast("Erro ao criar mensagem: " + err.message);
  }
}

async function atualizarMensagemWhatsapp(id, dados){
  const msg = estado.mensagensWhatsapp.find(m => m.id === id);
  if(msg) Object.assign(msg, dados); // atualiza a tela na hora
  try{
    await apiAtualizarMensagemWhatsapp(id, dados);
  }catch(err){
    mostrarToast("Erro ao salvar mensagem: " + err.message);
  }
}

async function excluirMensagemWhatsapp(id){
  if(estado.mensagensWhatsapp.length <= 1) return; // sempre precisa sobrar pelo menos uma
  const eraPadrao = estado.mensagensWhatsapp.find(m => m.id === id)?.padrao;
  try{
    await apiExcluirMensagemWhatsapp(id);
    estado.mensagensWhatsapp = estado.mensagensWhatsapp.filter(m => m.id !== id);
    if(eraPadrao && estado.mensagensWhatsapp.length > 0){
      await definirMensagemPadrao(estado.mensagensWhatsapp[0].id);
    }
  }catch(err){
    mostrarToast("Erro ao excluir mensagem: " + err.message);
  }
}

function primeiroNomeDe(textoCompleto){

}

function capitalizarPrimeiraLetra(texto){
  const t = String(texto || "").toLowerCase().trim();
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : "";
}

/* Calcula "Bom dia"/"Boa tarde"/"Boa noite" considerando o horário
   LOCAL do contato, não o horário de quem está usando o app. Parte do
   princípio de que o aparelho está no horário de Brasília (fuso de
   referência do negócio) e desloca pelo fuso relativo do contato
   (campo FUSO, ex: "0", "-2", "+4"). */
function periodoDoDiaAtual(fusoRelativoContato){
  const agora = new Date();
  const horaBrasiliaAtual = agora.getHours() + (agora.getMinutes() / 60);
  const offset = parseFloat(fusoRelativoContato) || 0;

  let horaContato = (horaBrasiliaAtual + offset) % 24;
  if(horaContato < 0) horaContato += 24;

  if(horaContato >= 5 && horaContato < 12) return "Bom dia";
  if(horaContato >= 12 && horaContato < 18) return "Boa tarde";
  return "Boa noite";
}

function linkWhatsapp(telefone, nome, indicadoPor, fusoRelativoContato){
  const digitos = String(telefone || "").replace(/\D/g, "");
  if(digitos === "") return "#";

  const template = obterMensagemWhatsappTemplate();
  const mensagem = template
    .replace(/\{nome\}/gi, primeiroNomeDe(nome))
    .replace(/\{indicado_por\}/gi, primeiroNomeDe(indicadoPor))
    .replace(/\{periodo\}/gi, periodoDoDiaAtual(fusoRelativoContato));

  return "https://wa.me/" + digitos + "?text=" + encodeURIComponent(mensagem);
}

/* ============================================================

 * Ao clicar no microfone, começa a ouvir e vai inserindo o texto
 * reconhecido no campo; clicar de novo (ou o navegador detectar
 * silêncio) para. O campo continua 100% editável por teclado
 * normalmente, o microfone é só um jeito a mais de preencher.
 * ============================================================ */
let reconhecimentoVozAtivo = null;
let botaoMicrofoneAtivo = null;

function alternarDitadoPorVoz(botao){
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognitionAPI){
    mostrarToast("Seu navegador não tem suporte a ditado por voz. Tente pelo Chrome.");
    return;
  }

  // Se já está ouvindo (nesse ou em outro campo), clicar de novo para.
  if(reconhecimentoVozAtivo){
    reconhecimentoVozAtivo.stop();
    return;
  }

  const idCampoAlvo = botao.dataset.campoAlvo;
  const campo = document.getElementById(idCampoAlvo);
  if(!campo) return;

  const reconhecimento = new SpeechRecognitionAPI();
  reconhecimento.lang = "pt-BR";
  reconhecimento.continuous = true;
  reconhecimento.interimResults = false;

  const textoOriginal = campo.value;
  let textoAdicionado = "";

  reconhecimento.onresult = (evento) => {
    let novoTrecho = "";
    for(let i = evento.resultIndex; i < evento.results.length; i++){
      if(evento.results[i].isFinal){
        novoTrecho += evento.results[i][0].transcript;
      }
    }
    if(novoTrecho.trim() !== ""){
      textoAdicionado += (textoAdicionado ? " " : "") + novoTrecho.trim();
      const separador = textoOriginal.trim() !== "" ? " " : "";
      campo.value = textoOriginal + separador + textoAdicionado;
    }
  };

  reconhecimento.onerror = (evento) => {
    if(evento.error !== "no-speech" && evento.error !== "aborted"){
      mostrarToast("Erro no ditado por voz: " + evento.error);
    }
  };

  reconhecimento.onend = () => {
    botao.classList.remove("ouvindo");
    reconhecimentoVozAtivo = null;
    botaoMicrofoneAtivo = null;
  };

  reconhecimento.start();
  botao.classList.add("ouvindo");
  reconhecimentoVozAtivo = reconhecimento;
  botaoMicrofoneAtivo = botao;
}

/* Todos os contatos carregados */
function contatosCombinados(){
  return estado.contatos;
}

/* Um contato passa nos filtros? (chaveExcluida = null pra checar tudo,
   ou o nome de um campo pra ignorá-lo — usado pro filtro em cascata) */
/* Campos usados pela busca livre — cobre tudo que já vem carregado
   na lista (nome, telefone, indicação, status, fuso/país/região,
   profissão, e as datas de registro) */
const CAMPOS_BUSCA_TEXTO = ["NOME", "TELEFONE", "INDICADO_POR", "STATUS_COMERCIAL", "STATUS_COMPORTAMENTAL", "REFERIDOS", "FUSO", "PAIS", "REGIAO", "PROFISSAO", "REGISTRO_TELEFONE", "REGISTRO_STATUS_COMERCIAL", "REGISTRO_STATUS_COMPORTAMENTAL"];

function passaNosFiltros(c, chaveExcluida){
  for(const campo of CAMPOS_FILTRO){
    if(campo.chave === chaveExcluida) continue;
    const selecionados = estado.filtros[campo.chave];
    if(selecionados.size === 0) continue;
    if(!selecionados.has(valorOuBranco(c[campo.chave]))) return false;
  }
  for(const campo of CAMPOS_FILTRO_DATA){
    if(campo.chave === chaveExcluida) continue;
    const filtro = estado.filtrosData[campo.chave];
    if(!filtro || (!filtro.de && !filtro.ate)) continue;

    const dataDoValor = String(c[campo.chave] || "").substring(0, 10); // "dd/MM/yyyy"
    if(dataDoValor === "") return false;

    if(filtro.de && filtro.ate){
      // Período: de "Tal" até "Tal", incluindo as duas pontas
      const valorIso = brParaIso(dataDoValor);
      const deIso = brParaIso(filtro.de);
      const ateIso = brParaIso(filtro.ate);
      if(valorIso < deIso || valorIso > ateIso) return false;
    } else if(filtro.de){
      // Só uma data preenchida = busca exatamente aquele dia
      if(dataDoValor !== filtro.de) return false;
    } else if(filtro.ate){
      const valorIso = brParaIso(dataDoValor);
      const ateIso = brParaIso(filtro.ate);
      if(valorIso > ateIso) return false;
    }
  }
  return true;
}

/* A Busca é independente dos Filtros: quando há um termo de busca
   ativo, ela ignora TODOS os filtros (Referidos, Fuso, País, datas,
   etc.) e procura em TODOS os contatos carregados — não só nos que
   passariam pelos filtros ativos. */
function algumFiltroAtivo(){
  for(const campo of CAMPOS_FILTRO){
    if(estado.filtros[campo.chave].size > 0) return true;
  }
  for(const campo of CAMPOS_FILTRO_DATA){
    const f = estado.filtrosData[campo.chave];
    if(f && (f.de || f.ate)) return true;
  }
  return false;
}

/* ============================================================
 * DUPLICADOS — quando o mesmo telefone aparece em mais de um
 * contato, mantém só 1 registro, preservando o nome de TODOS os
 * "Indicado por" diferentes (e a observação de cada um) e escolhendo
 * o Referido de maior prioridade entre os duplicados.
 * ============================================================ */

/* Prioridade do campo Referido ao mesclar — o valor mais "forte"
   (mais à esquerda) vence. Valores que não estão nessa lista (opções
   personalizadas) ficam depois desses 3, mas antes de vazio. */
const PRIORIDADE_REFERIDOS = ["Validado", "Indicado", "Frio"];

function telefoneComoChave(c){
  return String((c && c.TELEFONE) || "").replace(/\D/g, "");
}

function agruparContatosDuplicadosPorTelefone(lista){
  const porTelefone = {};
  lista.forEach(c => {
    const chave = telefoneComoChave(c);
    if(chave === "") return; // sem telefone não dá pra comparar
    if(!porTelefone[chave]) porTelefone[chave] = [];
    porTelefone[chave].push(c);
  });
  return Object.values(porTelefone).filter(grupo => grupo.length > 1);
}

function rankReferido(valor){
  if(!valor) return 999; // vazio é o mais fraco de todos
  const i = PRIORIDADE_REFERIDOS.indexOf(valor);
  return i === -1 ? 998 : i; // opção personalizada: quase o mais fraco, só perde pra vazio
}

/* Recebe um grupo (array) de contatos com o mesmo telefone e calcula
   quem sobrevive e com quais dados atualizados, e quem deve ser
   excluído. Não grava nada no banco — só calcula. */
function calcularMesclagemDeGrupo(grupo){
  const sobrevivente = grupo[0];
  const outros = grupo.slice(1);
  const dadosAtualizados = {};

  // Indicado por + observação — junta todos os nomes DISTINTOS de
  // quem indicou, cada um com sua observação (se tiver).
  const indicadoresNaOrdem = [];
  const observacaoPorIndicador = {};

  grupo.forEach(c => {
    const nomeIndicador = String(c.INDICADO_POR || "").trim();
    if(nomeIndicador === "") return;
    if(!indicadoresNaOrdem.includes(nomeIndicador)) indicadoresNaOrdem.push(nomeIndicador);
    const obs = String(c.OBSERVACAO_INDICADO || "").trim();
    if(obs !== "" && !observacaoPorIndicador[nomeIndicador]){
      observacaoPorIndicador[nomeIndicador] = obs;
    }
  });

  // Cada "Indicado por" fica numa linha, e a observação DELE fica na
  // mesma posição de linha no campo de Observação — assim os dois
  // campos continuam existindo separados (igual sempre foi), só que
  // agora com vários indicadores empilhados, um embaixo do outro.
  const indicadoPorMesclado = indicadoresNaOrdem.join("\n");
  const observacaoIndicadoMesclada = indicadoresNaOrdem
    .map(nome => observacaoPorIndicador[nome] || "")
    .join("\n");

  if(indicadoPorMesclado !== String(sobrevivente.INDICADO_POR || "").trim()){
    dadosAtualizados.INDICADO_POR = indicadoPorMesclado;
  }
  if(observacaoIndicadoMesclada !== String(sobrevivente.OBSERVACAO_INDICADO || "").trim()){
    dadosAtualizados.OBSERVACAO_INDICADO = observacaoIndicadoMesclada;
  }

  // Referido — vence o de maior prioridade (Indicado > Validado > Frio > outros > vazio)
  let melhorReferido = sobrevivente.REFERIDOS || "";
  grupo.forEach(c => {
    if(rankReferido(c.REFERIDOS) < rankReferido(melhorReferido)) melhorReferido = c.REFERIDOS;
  });
  if(melhorReferido !== (sobrevivente.REFERIDOS || "")){
    dadosAtualizados.REFERIDOS = melhorReferido;
  }

  // Outros campos: se o sobrevivente estiver em branco, preenche com
  // o primeiro valor não-vazio encontrado entre os duplicados.
  ["NOME", "PROFISSAO", "STATUS_COMERCIAL", "STATUS_COMPORTAMENTAL", "OBSERVACAO"].forEach(campo => {
    if(String(sobrevivente[campo] || "").trim() !== "") return;
    const comValor = outros.find(c => String(c[campo] || "").trim() !== "");
    if(comValor) dadosAtualizados[campo] = comValor[campo];
  });

  return {
    sobrevivente,
    dadosAtualizados,
    paraExcluir: outros
  };
}

/* Mescla UM grupo de duplicados: grava a mudança no sobrevivente (se
   houver) e apaga os outros — no banco e na memória. */
async function mesclarGrupoDuplicados(grupo){
  const { sobrevivente, dadosAtualizados, paraExcluir } = calcularMesclagemDeGrupo(grupo);

  if(Object.keys(dadosAtualizados).length > 0){
    await apiAtualizar(sobrevivente.aba, sobrevivente.linha, dadosAtualizados);
    Object.assign(sobrevivente, dadosAtualizados);
  }

  for(const dup of paraExcluir){
    await apiExcluir(dup.aba, dup.linha);
  }

  const idsExcluidos = new Set(paraExcluir.map(c => c.linha));
  estado.contatos = estado.contatos.filter(c => !idsExcluidos.has(c.linha));
}

let mesclandoDuplicados = false;

/* Varre TODOS os contatos carregados, agrupa por telefone e mescla
   cada grupo de duplicados encontrado.
   opcoes.silencioso: não avisa nada se não achar duplicado nenhum
   (usado nas chamadas automáticas depois de importar).
   opcoes.pularConfirmacao: não pede confirmação antes de mesclar
   (usado nas chamadas automáticas). */
async function mesclarTodosDuplicados(opcoes){
  opcoes = opcoes || {};
  if(mesclandoDuplicados) return;

  const grupos = agruparContatosDuplicadosPorTelefone(estado.contatos);
  if(grupos.length === 0){
    if(!opcoes.silencioso) mostrarToast("Nenhum contato duplicado encontrado.");
    return;
  }

  if(!opcoes.pularConfirmacao){
    const totalParaExcluir = grupos.reduce((soma, g) => soma + (g.length - 1), 0);
    const confirmou = confirm(
      `Foram encontrados ${grupos.length} telefone${grupos.length === 1 ? "" : "s"} duplicado${grupos.length === 1 ? "" : "s"} ` +
      `(${totalParaExcluir} registro${totalParaExcluir === 1 ? "" : "s"} a mais será${totalParaExcluir === 1 ? "" : "ão"} removido${totalParaExcluir === 1 ? "" : "s"}). ` +
      `O nome de quem indicou (e a observação) de todos eles é preservado no contato que ficar. Confirma a mesclagem? Essa ação não pode ser desfeita.`
    );
    if(!confirmou) return;
  }

  mesclandoDuplicados = true;
  let mesclados = 0;
  let erros = 0;

  for(const grupo of grupos){
    try{
      await mesclarGrupoDuplicados(grupo);
      mesclados++;
    }catch(err){
      erros++;
    }
  }

  mesclandoDuplicados = false;
  salvarCacheLocal();

  if(!opcoes.silencioso || mesclados > 0){
    mostrarToast(`${mesclados} duplicado${mesclados === 1 ? "" : "s"} mesclado${mesclados === 1 ? "" : "s"}${erros > 0 ? `, ${erros} com erro` : ""}`);
  }

  renderListaEContagem();
}

function contatosFiltradosFinal(){
  const termoBrutoTotal = estado.busca.trim();

  if(termoBrutoTotal !== ""){
    // Separa por " + " (com espaço dos dois lados) — assim um "+55" que
    // faça parte de um telefone não é confundido com o separador.
    const termos = termoBrutoTotal.split(/\s\+\s/).map(t => t.trim()).filter(t => t !== "");

    return contatosCombinados().filter(c => {
      const alvo = CAMPOS_BUSCA_TEXTO.map(chave => c[chave] || "").join(" ").toLowerCase();
      const alvoSoDigitos = alvo.replace(/\D/g, "");

      // Basta bater com QUALQUER UM dos termos digitados.
      return termos.some(termoOriginal => {
        const termoBusca = termoOriginal.toLowerCase();
        if(alvo.includes(termoBusca)) return true;

        // Se o termo tem dígitos (telefone, por exemplo), compara também
        // ignorando espaços, +, (), - e qualquer outra formatação — assim
        // a busca encontra o contato independente de como o número foi
        // digitado ou de como ele está salvo.
        const termoSoDigitos = termoOriginal.replace(/\D/g, "");
        if(termoSoDigitos.length >= 4 && alvoSoDigitos.includes(termoSoDigitos)) return true;

        return false;
      });
    });
  }

  // Atalho: sem filtro nenhum ativo (caso mais comum, tela recém-aberta),
  // não vale a pena percorrer e testar cada contato um por um.
  if(!algumFiltroAtivo()){
    return contatosCombinados();
  }

  return contatosCombinados().filter(c => passaNosFiltros(c, null));
}

/* Opções disponíveis pra um filtro = valores desse campo entre os
   contatos que já passam em TODOS OS OUTROS filtros ativos
   (filtro em cascata / faceted).
   PERFORMANCE: uma única passada com for-loop indexado, em vez de
   .filter() + .forEach() (que percorreriam a base duas vezes e
   ainda criariam um array intermediário) — roda toda vez que um
   chip de filtro é clicado, então vale a pena manter isso enxuto
   mesmo com dezenas de milhares de contatos carregados. */
function opcoesDisponiveis(chave){
  const lista = contatosCombinados();
  const total = lista.length;
  const contagem = {};

  for(let i = 0; i < total; i++){
    const c = lista[i];
    if(!passaNosFiltros(c, chave)) continue;
    const v = valorOuBranco(c[chave]);
    contagem[v] = (contagem[v] || 0) + 1;
  }

  return contagem;
}

/* ============================================================
 * BOOT — carrega contatos e opções em paralelo, uma vez só
 * ------------------------------------------------------------
 * PERFORMANCE: usa localStorage como cache local. Na abertura,
 * se existir um cache de até 10 minutos, o app já mostra esses
 * contatos IMEDIATAMENTE (sem esperar a rede) e, em paralelo,
 * busca os dados atualizados no servidor — quando chegam,
 * a tela é atualizada de novo sozinha. Isso elimina a sensação
 * de "tela em branco carregando" em aberturas repetidas do app,
 * mesmo com internet lenta.
 * ============================================================ */
const CACHE_LOCAL_CHAVE = "matriculas_cache_contatos_v1";
const CACHE_LOCAL_MINUTOS = 20;

function lerCacheLocal(){
  try{
    const bruto = localStorage.getItem(CACHE_LOCAL_CHAVE);
    if(!bruto) return null;
    const dados = JSON.parse(bruto);
    const idadeMinutos = (Date.now() - dados.salvoEm) / 60000;
    if(idadeMinutos > CACHE_LOCAL_MINUTOS) return null;
    return dados;
  }catch(err){
    return null;
  }
}

/* PERFORMANCE: a gravação no localStorage (serializar ~18 mil contatos
   de novo em JSON) é adiada pro próximo ciclo do navegador (setTimeout 0),
   pra não competir com a atualização da tela que acabou de chegar — a
   lista aparece primeiro, e o cache é salvo logo em seguida, sem
   travar a rolagem/renderização nesse instante. */
function salvarCacheLocal(){
  setTimeout(() => {
    try{
      localStorage.setItem(CACHE_LOCAL_CHAVE, JSON.stringify({
        contatos: estado.contatos,
        opcoes: estado.opcoes,
        salvoEm: Date.now()
      }));
    }catch(err){
      // Se o localStorage falhar (espaço cheio, modo privado, etc.),
      // o app continua funcionando normalmente, só sem cache local.
    }
  }, 0);
}

async function iniciar(){
  restaurarFiltrosSalvos();

  const cache = lerCacheLocal();

  if(cache){
    // Mostra o que já temos guardado imediatamente, sem esperar a rede.
    estado.contatos = cache.contatos || [];
    estado.opcoes = cache.opcoes || estado.opcoes;
    estado.carregando = false;
  }

  renderTudo();

  // Sempre busca dados atualizados em paralelo (mesmo tendo cache),
  // pra nunca deixar o usuário travado num dado antigo por muito tempo.
  carregarContatos().then(rodarLimpezaDuplicadosUmaVez);
  carregarOpcoes();
  carregarMensagensWhatsapp();
}

/* Roda a mesclagem de duplicados UMA ÚNICA VEZ, na primeira vez que o
   app abrir depois dessa atualização — pra limpar os duplicados que já
   existiam sem precisar de nenhum botão. Depois disso, a mesclagem só
   acontece automaticamente quando um contato novo é criado/importado. */
const CHAVE_DUPLICADOS_MIGRADOS = "duplicadosMigradosV1";

async function rodarLimpezaDuplicadosUmaVez(){
  try{
    if(localStorage.getItem(CHAVE_DUPLICADOS_MIGRADOS)) return;
  }catch(e){ return; }

  await mesclarTodosDuplicados({ silencioso: true, pularConfirmacao: true });

  try{ localStorage.setItem(CHAVE_DUPLICADOS_MIGRADOS, "1"); }catch(e){ /* segue mesmo assim */ }
}

async function carregarContatos(){
  try{
    estado.contatos = await apiListar(ABA_CONTATOS);
    salvarCacheLocal();
  }catch(err){
    // Se já tínhamos cache local mostrado na tela, um erro de rede aqui
    // não precisa assustar o usuário com um toast — ele já está vendo
    // os últimos dados conhecidos. Só avisa se não havia nada na tela.
    if(estado.contatos.length === 0){
      mostrarToast("Erro ao carregar contatos: " + err.message);
    }
  }
  estado.carregando = false;
  renderTudo();
}

async function carregarOpcoes(){
  try{
    const opcoes = await apiOpcoes();
    estado.opcoes = opcoes;
    salvarCacheLocal();
  }catch(err){
    // Silencioso — se falhar, o app usa listas vazias (mostra só o valor
    // atual do contato) em vez de travar a tela toda.
  }
}

function renderConteudoExpandidoFiltro(item){
  if(item.tipo === "checklist"){
    const contagens = opcoesDisponiveis(item.chave);
    const valores = ordenarValoresFiltro(item.chave, Object.keys(contagens));
    const selecionados = estado.filtros[item.chave];

    if(valores.length === 0){
      return `<div class="dropdown-filtro-inline"><p class="filtros-valores-vazio">Nenhuma opção disponível.</p></div>`;
    }
    return `<div class="dropdown-filtro-inline" id="painelFiltroExpandido">
      ${valores.map((v, i) => `
        <div class="check-row">
          <input type="checkbox" id="chkFiltroTela_${i}" ${selecionados.has(v) ? "checked" : ""} data-valor="${encodeURIComponent(v)}">
          <label for="chkFiltroTela_${i}">${v}</label>
          <span class="count">${contagens[v]}</span>
        </div>
      `).join("")}
    </div>`;
  }

  const filtro = estado.filtrosData[item.chave] || { de: "", ate: "" };
  const deIso = brParaIso(filtro.de);
  const ateIso = brParaIso(filtro.ate);

    </div>
    <div class="detail-field">
      <div class="k">Até (opcional — preencha só se quiser um período)</div>
      <input type="date" id="inputFiltroDataAte" value="${ateIso}" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;">
    </div>
  </div>`;
}

  const mapaCampos = {};
  CAMPOS_FILTRO.forEach(f => mapaCampos[f.chave] = { ...f, tipo: "checklist" });
  CAMPOS_FILTRO_DATA.forEach(f => mapaCampos[f.chave] = { ...f, tipo: "data" });

  const chipBotao = (chave) => {
    const f = mapaCampos[chave];
    const ativa = estado.filtroCategoriaAtiva === chave;

    if(f.tipo === "checklist"){
      const n = estado.filtros[chave].size;
      if(n > 0) badge = ` <span class="n">${n}</span>`;
    } else if(estado.filtrosData[chave] && (estado.filtrosData[chave].de || estado.filtrosData[chave].ate)){

    return `<button type="button" class="chip grid ${ativa ? "active" : ""}" data-campo="${chave}">${f.rotulo}${badge}</button>`;

      <div class="filter-grid">${chipBotao("REGIAO")}${chipBotao("STATUS_COMERCIAL")}${chipBotao("STATUS_COMPORTAMENTAL")}</div>
      <div class="filter-grid">${chipBotao("PROFISSAO")}${chipBotao("REGISTRO_STATUS_COMERCIAL")}${chipBotao("REGISTRO_STATUS_COMPORTAMENTAL")}</div>
      <div class="filter-grid">
        ${chipBotao("REGISTRO_TELEFONE")}${chipBotao("AGENDAMENTO")}
        <div style="display:flex;gap:6px;align-items:center;">
          <button type="button" class="chip grid ${temFiltroPraLimpar ? "active" : ""}" id="btnLimparFiltro" style="flex:1;" ${temFiltroPraLimpar ? "" : "disabled"}>Limpar</button>
          <button type="button" class="btn-icon-claro" id="btnBaixarFiltrado" aria-label="Baixar lista filtrada em Excel/CSV" title="Baixar lista filtrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
        </div>
      </div>

      ${estado.filtroCategoriaAtiva ? renderConteudoExpandidoFiltro(mapaCampos[estado.filtroCategoriaAtiva]) : ""}

      <p style="color:var(--ink-faint);font-size:11.5px;margin:10px 0 0;">Toque num filtro pra ver as opções. Marcar ou desmarcar já aplica na hora.</p>
    </div>
  `;

  document.getElementById("fecharSheet").addEventListener("click", fecharTelaFiltro);

  sheet.querySelectorAll(".chip[data-campo]").forEach(chip => {
    chip.addEventListener("click", () => {
      const chave = chip.dataset.campo;
      estado.filtroCategoriaAtiva = (estado.filtroCategoriaAtiva === chave) ? null : chave;
      renderTelaFiltro();
    });
  });

  if(estado.filtroCategoriaAtiva){
    const itemAtivo = mapaCampos[estado.filtroCategoriaAtiva];
    if(itemAtivo.tipo === "checklist"){
      document.querySelectorAll("#painelFiltroExpandido input[type=checkbox]").forEach(chk => {
        chk.addEventListener("change", () => {
          const valor = decodeURIComponent(chk.dataset.valor);
          if(chk.checked) estado.filtros[itemAtivo.chave].add(valor); else estado.filtros[itemAtivo.chave].delete(valor);
          renderTelaFiltro();
          renderListaEContagem();
        });
      });
    } else {
      const inputDe = document.getElementById("inputFiltroDataDe");
      const inputAte = document.getElementById("inputFiltroDataAte");
      if(inputDe){
        inputDe.addEventListener("change", (e) => {
          const atual = estado.filtrosData[itemAtivo.chave] || { de: "", ate: "" };
          estado.filtrosData[itemAtivo.chave] = { de: isoParaBr(e.target.value), ate: atual.ate };
          renderTelaFiltro();
          renderListaEContagem();
        });
      }
      if(inputAte){
        inputAte.addEventListener("change", (e) => {
          const atual = estado.filtrosData[itemAtivo.chave] || { de: "", ate: "" };
          estado.filtrosData[itemAtivo.chave] = { de: atual.de, ate: isoParaBr(e.target.value) };
          renderTelaFiltro();
          renderListaEContagem();
        });

    limparTodosFiltros();
    renderTelaFiltro();

/* Limpa todos os filtros ativos (checklist + data) de uma vez, sem
   mexer na Busca — e atualiza a lista na hora, sem filtro nenhum. */
function limparTodosFiltros(){
  CAMPOS_FILTRO.forEach(campo => estado.filtros[campo.chave].clear());
  CAMPOS_FILTRO_DATA.forEach(campo => { estado.filtrosData[campo.chave] = { de: "", ate: "" }; });
  renderListaEContagem();
}

/* ============================================================
 * PERFORMANCE — renderização em lotes (paginação / scroll infinito)
 * ------------------------------------------------------------
 * Com a base passando de 15-18 mil contatos, criar TODOS os cards
 * no DOM de uma vez (innerHTML gigante) é hoje o maior gargalo de
 * velocidade do app — muito maior que rede ou backend. A solução:
 * renderiza só um lote por vez (pequeno no início, maior depois) e,
 * conforme o usuário
 * rola a tela pra baixo, vai acrescentando mais lotes (em vez de
 * recriar a lista inteira). Isso reduz o tempo de primeira exibição
 * de segundos pra frações de segundo, mesmo com a base toda carregada
 * na memória.
 * ============================================================ */
const TAMANHO_LOTE_INICIAL = 24; // primeiro lote pequeno: aparece na tela quase instantaneamente
const TAMANHO_LOTE_SEGUINTE = 70; // lotes seguintes maiores: menos interrupções durante a rolagem
let observerScrollInfinito = null;
let listaFiltradaAtual = [];
let quantidadeRenderizada = 0;

function renderListaEContagem(){
  const carregando = algumCarregando();
  const totalCarregado = estado.contatos.length;

  const contagem = document.querySelector(".result-count");
  if(contagem) contagem.textContent = "";

  const lista = document.getElementById("listaContatos");
  if(!lista) return;

  if(carregando && totalCarregado === 0){
    lista.innerHTML = `<div class="loading">Carregando matrículas...</div>`;
    return;
  }

  listaFiltradaAtual = contatosFiltradosFinal();
  persistirFiltrosAtivos();

  if(listaFiltradaAtual.length === 0){
    lista.innerHTML = `<div class="empty-state"><div class="big">🔍</div>Nenhum contato encontrado com esses filtros.</div>`;
    return;
  }

  quantidadeRenderizada = 0;
  lista.innerHTML = `<div id="cardsWrap"></div><div id="sentinelaScroll" style="height:1px;"></div>`;

  // Delegação de eventos: UM listener no container, em vez de um por
  // card — evita criar milhares de listeners individuais, que também
  // pesa bastante com uma lista grande.
  lista.removeEventListener("click", handleCliqueNaLista);
  lista.addEventListener("click", handleCliqueNaLista);
  lista.removeEventListener("change", handleMudancaNaLista);
  lista.addEventListener("change", handleMudancaNaLista);

  renderizarProximoLote();
  configurarScrollInfinito(lista);
}

/* Atraso antes de remover um card da lista quando ele deixa de bater
   com o filtro ativo (só depois de mudar Status Comercial e/ou Status
   do Contato). Fica em 60s e reinicia a contagem se o outro status
   também for alterado logo em seguida — assim mudar só um dos dois
   não faz o contato sumir antes de você ajustar o segundo. */
const timeoutsRemocaoCard = {};
function agendarRemocaoCardComFiltro(linha){
  if(timeoutsRemocaoCard[linha]) clearTimeout(timeoutsRemocaoCard[linha]);
  timeoutsRemocaoCard[linha] = setTimeout(() => {
    delete timeoutsRemocaoCard[linha];
    sincronizarCardComFiltroAtivo(linha);
  }, 60000);
}

async function handleMudancaNaLista(e){
  const selectComercial = e.target.closest(".status-comercial-inline");
  const selectComportamental = e.target.closest(".status-comportamental-inline");
  const inputAgenda = e.target.closest("[data-agenda-input]");

  if(inputAgenda){
    const wrap = inputAgenda.closest(".detail-field");
    const rotuloDia = wrap && wrap.querySelector(".dia-semana-agenda");
    if(rotuloDia) rotuloDia.textContent = calcularDiaSemanaTexto(inputAgenda.value);
    return;
  }

  const select = selectComercial || selectComportamental;
  if(!select) return;

  const campoDb = selectComercial ? "STATUS_COMERCIAL" : "STATUS_COMPORTAMENTAL";
  const campoData = selectComercial ? "REGISTRO_STATUS_COMERCIAL" : "REGISTRO_STATUS_COMPORTAMENTAL";
  const linha = Number(select.dataset.linha);
  const aba = select.dataset.aba;
  const novoValor = select.value;

  select.classList.add("salvando");
  select.disabled = true;

  try{
    await apiAtualizar(aba, linha, { [campoDb]: novoValor });

    const c = estado.contatos.find(x => x.linha === linha);
    if(c){
      c[campoDb] = novoValor;
      c[campoData] = hojeFormatadoBr();
    }

    mostrarToast((selectComercial ? "Status Comercial" : "Status do Contato") + " salvo");

    // Se mudou pra AGENDADO no Status Comercial, já abre a tela de
    // agendamento pra escolher data e hora, sem precisar de outro toque.
    if(selectComercial && novoValor === "AGENDADO"){
      const ui = obterCardUI(linha);
      ui.expandido = true;
      ui.agendamentoAberto = true;
      ui.mostrarFormAgendamento = true;
      ui.erroAgendamento = "";
      atualizarCardCompleto(linha);
    }

    // Se algum filtro estiver ativo, o contato pode ter deixado de
    // pertencer a ele — agenda a remoção do card em 30s (dá tempo de
    // ajustar o outro status antes de sumir da lista).
    agendarRemocaoCardComFiltro(linha);
  }catch(err){
    mostrarToast("Erro ao salvar: " + err.message);
  }finally{
    select.classList.remove("salvando");
    select.disabled = false;
  }
}

function calcularDiaSemanaTexto(valorDatetimeLocal){
  if(!valorDatetimeLocal) return "";
  const d = new Date(valorDatetimeLocal);
  if(isNaN(d.getTime())) return "";
  const dias = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
  return dias[d.getDay()];
}

function hojeFormatadoBr(){
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return pad(d.getDate()) + "/" + pad(d.getMonth()+1) + "/" + d.getFullYear();
}

function handleCliqueNaLista(e){
  const card = e.target.closest(".card");
  if(!card) return;

  const linha = Number(card.dataset.linha);
  const aba = card.dataset.aba;

  if(e.target.closest(".icon-btn.info")){ alternarExpansaoCard(aba, linha); return; }
  if(e.target.closest("[data-acao='editar']")){ ativarEdicaoCard(linha); return; }
  if(e.target.closest("[data-acao='cancelar-edicao']")){ cancelarEdicaoCard(linha); return; }
  if(e.target.closest("[data-acao='salvar']")){ salvarEdicaoCard(aba, linha); return; }
  if(e.target.closest("[data-acao='excluir']")){ confirmarExclusaoCard(aba, linha); return; }
  if(e.target.closest("[data-acao='abrir-agendamento']")){ abrirAgendamentoCard(linha); return; }
  if(e.target.closest("[data-acao='reagendar']")){ reagendarCard(linha); return; }
  if(e.target.closest("[data-acao='cancelar-form-agendamento']")){ cancelarFormAgendamentoCard(linha); return; }
  if(e.target.closest("[data-acao='confirmar-agendamento']")){ confirmarAgendamentoCard(aba, linha); return; }
  if(e.target.closest("[data-acao='cancelar-agendamento']")){ cancelarAgendamentoCard(aba, linha); return; }

  const btnMicrofone = e.target.closest(".btn-microfone");
  if(btnMicrofone){ alternarDitadoPorVoz(btnMicrofone); return; }
}

/* ============================================================
 * CARD DA LISTA — expansível inline (sem abrir tela nova)
 * ------------------------------------------------------------
 * Linha 1: nome + botão detalhes + botão whatsapp
 * Linha 2: telefone
 * (o resto fica oculto até clicar no botão de detalhes)
 * ============================================================ */
/* Mostra, abaixo do telefone (mesmo sem expandir o card), o valor de
   cada campo que tem um filtro ativo no momento — só quando existe
   pelo menos um filtro ligado e a Busca não está em uso (a Busca
   ignora os filtros, então não faz sentido mostrar badge de filtro
   junto com ela). */
function badgesFiltroAtivo(c){
  const buscaAtiva = estado.busca.trim() !== "";
  if(buscaAtiva || !algumFiltroAtivo()) return "";

  const pills = [];

  CAMPOS_FILTRO.forEach(campo => {
    if(estado.filtros[campo.chave].size === 0) return;
    const valor = valorOuBranco(c[campo.chave]);
    pills.push(`<span class="filtro-badge">${valor}</span>`);
  });

  CAMPOS_FILTRO_DATA.forEach(campo => {
    const f = estado.filtrosData[campo.chave];
    if(!f || (!f.de && !f.ate)) return;
    const valor = String(c[campo.chave] || "").substring(0, 10);
    pills.push(`<span class="filtro-badge">${valor || "—"}</span>`);
  });

  if(pills.length === 0) return "";
  return `<div class="filtro-badges-row">${pills.join("")}</div>`;
}

/* Quando um contato é editado (status, referido, fuso, etc.) enquanto
   existe um filtro ativo, ele pode deixar de pertencer a esse filtro.
   Esta função remove o card da lista visível na hora, sem esperar um
   novo carregamento — assim a lista sempre reflete só quem realmente
   ainda bate com o filtro ligado. Retorna true se removeu (pra quem
   chamou saber que não precisa mais re-renderizar o card normalmente). */
function sincronizarCardComFiltroAtivo(linha){
  const buscaAtiva = estado.busca.trim() !== "";
  if(buscaAtiva || !algumFiltroAtivo()) return false;

  const c = estado.contatos.find(x => x.linha === linha);
  if(!c) return false;
  if(passaNosFiltros(c, null)) return false;

  const idxLista = listaFiltradaAtual.findIndex(x => x.linha === linha);
  if(idxLista !== -1){
    listaFiltradaAtual.splice(idxLista, 1);
    if(idxLista < quantidadeRenderizada) quantidadeRenderizada--;
  }

  const el = document.getElementById("card-" + linha);
  if(el) el.remove();

  if(document.querySelectorAll("#cardsWrap .card").length === 0){
    const lista = document.getElementById("listaContatos");
    if(lista) lista.innerHTML = `<div class="empty-state"><div class="big">🔍</div>Nenhum contato encontrado com esses filtros.</div>`;
  }

  return true;
}

/* Renderiza "Indicado por" e "Observação do Indicado por" em pares
   empilhados — o 1º indicado por seguido da observação dele, depois
   o 2º e a observação dele, e assim por diante, quantos existirem.
   Os dois campos no banco guardam uma linha por indicador, na mesma
   ordem (linha 1 de um corresponde à linha 1 do outro). */
function renderIndicadosEObservacoes(c){
  const nomes = String(c.INDICADO_POR || "").split("\n").map(s => s.trim()).filter(s => s !== "");
  const observacoes = String(c.OBSERVACAO_INDICADO || "").split("\n");

  if(nomes.length === 0){
    return campoDetalheLinha("Indicado por", "", false) + campoDetalheLinha("Observação do Indicado por", "", false);
  }

  return nomes.map((nome, i) => {
    const sufixo = nomes.length > 1 ? ` ${i + 1}` : "";
    return campoDetalheLinha("Indicado por" + sufixo, nome, false)
      + campoDetalheLinha("Observação do Indicado por" + sufixo, (observacoes[i] || "").trim(), false);
  }).join("");
}

function renderDuplicatasCard(ui){
  if(ui.carregandoDuplicatas){

  if(!ui.duplicatas || ui.duplicatas.length === 0) return "";
  return ui.duplicatas.map(d => `

}

   já que nome/telefone no topo também viram campos editáveis) */
function atualizarCardCompleto(linha){
  const el = document.getElementById("card-" + linha);
  const c = estado.contatos.find(x => x.linha === linha);
  if(!el || !c) return;
  el.innerHTML = cardInnerHtml(c);

async function alternarExpansaoCard(aba, linha){
  const ui = obterCardUI(linha);
  ui.expandido = !ui.expandido;

  const extra = document.getElementById("cardExtra-" + linha);
  const btnInfo = document.querySelector(`#card-${linha} .icon-btn.info`);
  if(btnInfo) btnInfo.classList.toggle("active", ui.expandido);
  if(!extra) return;

  if(!ui.expandido){
    extra.style.display = "none";
    return;
  }

  // PERFORMANCE: Observação do Contato/Indicado por já vêm no
  // carregamento inicial (junto com todo o resto), então expandir um
  // card é 100% local — não faz nenhuma chamada de rede, aparece
  // instantaneamente, sem "Carregando...".
  extra.style.display = "block";
  renderCardExtra(linha);
  carregarDuplicatasDoCard(linha);
}

/* Contatos com o mesmo telefone (já vem formatado de forma canônica
   pelo backend, então comparar a string direto é confiável) */
function contatosComMesmoTelefone(c){
  const tel = String(c.TELEFONE || "").trim();
  if(!tel) return [];
  return estado.contatos.filter(x => x.linha !== c.linha && String(x.TELEFONE || "").trim() === tel);
}

/* PERFORMANCE: INDICADO_POR e OBSERVACAO_INDICADO de cada duplicado já
   vêm no carregamento inicial (resumo), então não precisa mais buscar
   o "detalhe" de cada duplicado na rede — é só ler direto de
   estado.contatos, instantâneo. */
function carregarDuplicatasDoCard(linha){
  const ui = obterCardUI(linha);
  const c = estado.contatos.find(x => x.linha === linha);
  if(!c) return;

  const outros = contatosComMesmoTelefone(c);
  ui.duplicatas = outros.map(o => ({ INDICADO_POR: o.INDICADO_POR, OBSERVACAO_INDICADO: o.OBSERVACAO_INDICADO }));
  ui.carregandoDuplicatas = false;
  renderCardExtra(linha);
}

async function salvarEdicaoCard(aba, linha){
  const ui = obterCardUI(linha);
  if(ui.salvando) return;

  const el = document.getElementById("card-" + linha);
  const dados = {};
  el.querySelectorAll("[data-campo]").forEach(campo => { dados[campo.dataset.campo] = campo.value; });

  ui.salvando = true;
  ui.erroSalvar = "";
  atualizarCardCompleto(linha);

  try{
    await apiAtualizar(aba, linha, dados);

    const idx = estado.contatos.findIndex(x => x.linha === linha);
    if(idx !== -1) Object.assign(estado.contatos[idx], dados);
    salvarCacheLocal();

    ui.editando = false;
    ui.salvando = false;
    if(!sincronizarCardComFiltroAtivo(linha)){
      atualizarCardCompleto(linha);
    }
    mostrarToast("Contato atualizado!");
  }catch(err){
    ui.salvando = false;
    ui.erroSalvar = "Não foi possível salvar: " + err.message;
    atualizarCardCompleto(linha);
  }
}

  const c = estado.contatos.find(x => x.linha === linha);
  if(!c) return;
  if(!confirm(`Excluir o contato "${c.NOME}"? Essa ação não pode ser desfeita.`)) return;
  excluirContatoCard(aba, linha);

async function excluirContatoCard(aba, linha){
  try{

    await apiExcluir(aba, linha);
    estado.contatos = estado.contatos.filter(x => x.linha !== linha);

/* ============================================================
 * GOOGLE AGENDA — cria/atualiza/apaga o evento de verdade na
 * agenda do Google sempre que um agendamento é confirmado,
 * reagendado ou cancelado no app.
 * ============================================================ */
let googleTokenClientCalendar = null;
let tokenGoogleCalendarAtual = null;

function obterTokenGoogleCalendar(){
  return new Promise((resolve, reject) => {
    if(GOOGLE_CLIENT_ID.startsWith("COLE_AQUI")){
      reject(new Error("Configuração do Google ainda não foi concluída."));
      return;
    }
    if(typeof google === "undefined" || !google.accounts || !google.accounts.oauth2){
      reject(new Error("Não foi possível carregar o login do Google."));
      return;
    }
    if(tokenGoogleCalendarAtual){
      resolve(tokenGoogleCalendarAtual);
      return;
    }

    if(!googleTokenClientCalendar){
      googleTokenClientCalendar = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GOOGLE_CALENDAR_SCOPE,
        callback: (resposta) => {
          if(resposta && resposta.access_token){
            tokenGoogleCalendarAtual = resposta.access_token;
            resolve(resposta.access_token);
          } else {
            reject(new Error("Não foi possível conectar ao Google Agenda."));
          }
        }
      });
    }

    googleTokenClientCalendar.requestAccessToken();
  });
}

function montarTituloEventoAgenda(c){
  const partes = [c.STATUS_COMERCIAL, c.NOME, c.TELEFONE, c.INDICADO_POR].filter(p => p && String(p).trim() !== "");
  return partes.join(" - ");
}

function montarNotasEventoAgenda(c){
  const digitosTelefone = String(c.TELEFONE || "").replace(/\D/g, "");
  const linhas = [
    "Status: " + (c.STATUS_COMERCIAL || ""),
    "Nome: " + (c.NOME || ""),
    "Observação do contato: " + (c.OBSERVACAO || ""),
    "Telefone: " + (c.TELEFONE || ""),
    "WhatsApp: " + (digitosTelefone ? "https://wa.me/" + digitosTelefone : ""),
    "Indicado por: " + (c.INDICADO_POR || ""),
    "Observação do Indicado por: " + (c.OBSERVACAO_INDICADO || "")
  ];
  return linhas.join("\n");
}

/* Cria o evento (se ainda não existe um pra este contato) ou
   atualiza o mesmo evento (reagendamento). Retorna o ID do evento
   do Google, pra ser salvo em ID_EVENTO_AGENDA no banco. Erros aqui
   não devem travar o resto do fluxo — o agendamento já foi salvo no
   app de qualquer forma. */
async function criarOuAtualizarEventoAgenda(c, dataHoraIso){
  const token = await obterTokenGoogleCalendar();

  const inicio = new Date(dataHoraIso);
  const fim = new Date(inicio.getTime() + 60 * 60 * 1000); // 1h de duração padrão

  const corpo = {
    summary: montarTituloEventoAgenda(c),
    description: montarNotasEventoAgenda(c),
    start: { dateTime: inicio.toISOString(), timeZone: "America/Sao_Paulo" },
    end: { dateTime: fim.toISOString(), timeZone: "America/Sao_Paulo" }
  };

  const eventoExistente = c.ID_EVENTO_AGENDA;
  const calendarioCodificado = encodeURIComponent(GOOGLE_CALENDAR_ID);
  const url = eventoExistente
    ? `https://www.googleapis.com/calendar/v3/calendars/${calendarioCodificado}/events/${eventoExistente}`
    : `https://www.googleapis.com/calendar/v3/calendars/${calendarioCodificado}/events`;

  const resposta = await fetch(url, {
    method: eventoExistente ? "PATCH" : "POST",
    headers: {
      Authorization: `Bearer ${token}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(corpo)
  });

  if(!resposta.ok){
    // Se o evento antigo já não existir mais no Google (apagado manualmente
    // por lá, por exemplo), cria um novo em vez de falhar.
    if(eventoExistente && resposta.status === 404){
      return criarOuAtualizarEventoAgenda({ ...c, ID_EVENTO_AGENDA: null }, dataHoraIso);
    }
    throw new Error("Falha na Agenda (" + resposta.status + ")");
  }

  const dados = await resposta.json();
  return dados.id;
}

async function excluirEventoAgenda(eventoId){
  if(!eventoId) return;
  try{
    const token = await obterTokenGoogleCalendar();
    const calendarioCodificado = encodeURIComponent(GOOGLE_CALENDAR_ID);
    await fetch(`https://www.googleapis.com/calendar/v3/calendars/${calendarioCodificado}/events/${eventoId}`, {
      method: "DELETE",
      headers: { Authorization: `Bearer ${token}` }
    });
  }catch(err){
    // Se não der pra apagar da Agenda (sem internet, token negado etc.),
    // o agendamento já foi removido do app de qualquer forma.
  }
}

async function confirmarAgendamentoCard(aba, linha){
  const ui = obterCardUI(linha);
  if(ui.salvandoAgendamento) return;

  const el = document.getElementById("card-" + linha);
  const input = el.querySelector("[data-agenda-input]");
  const valor = input.value;

  if(!valor){
    ui.erroAgendamento = "Escolha uma data e hora.";
    renderCardExtra(linha);
    return;
  }

  ui.salvandoAgendamento = true;
  ui.erroAgendamento = "";
  renderCardExtra(linha);

  try{
    const resultado = await apiAgendar(aba, linha, valor);

    const idx = estado.contatos.findIndex(x => x.linha === linha);
    if(idx !== -1){
      estado.contatos[idx].STATUS_COMERCIAL = "AGENDADO";
      estado.contatos[idx].AGENDAMENTO = resultado.agendamento.dataHora;
    }
    salvarCacheLocal();

    ui.mostrarFormAgendamento = false;
    ui.salvandoAgendamento = false;
    ui.agendamentoAberto = false;
    if(!sincronizarCardComFiltroAtivo(linha)){
      atualizarCardCompleto(linha);
    }
    mostrarToast("Agendamento confirmado!");

    // Cria/atualiza o evento na Agenda do Google — se falhar, o
    // agendamento já está salvo no app de qualquer forma, então só
    // avisa sem desfazer nada.
    try{
      const contatoAtual = estado.contatos[idx];
      const eventoId = await criarOuAtualizarEventoAgenda(contatoAtual, valor);
      if(eventoId && eventoId !== contatoAtual.ID_EVENTO_AGENDA){
        contatoAtual.ID_EVENTO_AGENDA = eventoId;
        await apiAtualizar(aba, linha, { ID_EVENTO_AGENDA: eventoId });
      }
    }catch(erroAgenda){
      mostrarToast("Agendado no app, mas não sincronizou com o Google Agenda: " + erroAgenda.message);
    }
  }catch(err){
    ui.salvandoAgendamento = false;
    ui.erroAgendamento = "Não foi possível agendar: " + err.message;
    renderCardExtra(linha);
  }
}

async function cancelarAgendamentoCard(aba, linha){
  if(!confirm("Cancelar este agendamento? O evento será removido da agenda.")) return;

  const ui = obterCardUI(linha);
  ui.salvandoAgendamento = true;
  renderCardExtra(linha);

  try{
    const idxAntes = estado.contatos.findIndex(x => x.linha === linha);
    const eventoIdAntigo = idxAntes !== -1 ? estado.contatos[idxAntes].ID_EVENTO_AGENDA : null;

    await apiCancelarAgendamento(aba, linha);

    const idx = estado.contatos.findIndex(x => x.linha === linha);
    if(idx !== -1){
      estado.contatos[idx].AGENDAMENTO = "";
      estado.contatos[idx].ID_EVENTO_AGENDA = "";
    }
    salvarCacheLocal();

    ui.salvandoAgendamento = false;
    ui.agendamentoAberto = false;
    if(!sincronizarCardComFiltroAtivo(linha)){
      atualizarCardCompleto(linha);
    }
    mostrarToast("Agendamento cancelado.");

    // Apaga o evento correspondente na Agenda do Google (silenciosamente
    // — se não conseguir, o agendamento já foi removido do app mesmo assim).
    excluirEventoAgenda(eventoIdAntigo);
  }catch(err){
    ui.salvandoAgendamento = false;
    mostrarToast("Erro ao cancelar: " + err.message);
    renderCardExtra(linha);
  }
}

function configurarScrollInfinito(lista){
  if(observerScrollInfinito) observerScrollInfinito.disconnect();

  const sentinela = document.getElementById("sentinelaScroll");
  if(!sentinela) return;

  observerScrollInfinito = new IntersectionObserver((entradas) => {
    entradas.forEach(entrada => {

        renderizarProximoLote();

/* ============================================================
 * FILTROS — abaixo, seleção e ordenação de valores por categoria
 * ============================================================ */
function ordenarValoresFiltro(chave, valores){
  if(chave === "FUSO"){
    // Ordem numérica: ...-2, -1, 0, +1, +2... com "(em branco)" sempre por último
    return valores.slice().sort((a, b) => {
      if(a === "(em branco)") return 1;
      if(b === "(em branco)") return -1;
      return parseFloat(a) - parseFloat(b);
    });
  }
  return valores.slice().sort((a, b) => a.localeCompare(b, "pt-BR"));
}

/* Detecta se uma linha "parece" um telefone (bastante dígitos,
   pode ter +, espaços, parênteses e hífen). */
function linhaPareceTelefone(linha){
  const digitos = linha.replace(/\D/g, "");
  if(digitos.length < 8) return false;
  // A linha inteira, tirando os dígitos, só pode ter espaço, +, (, ), -
  const resto = linha.replace(/[\d\s()+\-]/g, "");
  return resto === "";
}

/**
 * Recebe o texto colado (várias linhas) e devolve uma lista de
 * { nome, telefone, profissao }. Funciona tanto no padrão "Nome" seguido de
 * "Telefone" quanto o contrário, e também lida com telefone sem
 * nome (fica com nome em branco).
 */
function interpretarTextoColado(texto){
  const linhas = texto.split("\n").map(l => l.trim()).filter(l => l !== "");
  const contatos = [];
  let nomePendente = "";

  for(let i = 0; i < linhas.length; i++){
    const linha = linhas[i];

    if(linhaPareceTelefone(linha)){
      contatos.push({ nome: nomePendente, telefone: linha, profissao: "", observacao: "" });
      nomePendente = "";
    } else {
      // Se já tinha um nome pendente sem telefone associado (2 nomes
      // seguidos), o de antes fica sem telefone — descarta, porque
      // um contato sem telefone não serve de nada aqui.
      nomePendente = linha;
    }
  }

  return contatos;
}
