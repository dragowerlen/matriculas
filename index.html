/* ------------------------------------------------------------
 * IMPORTAÇÃO VIA GOOGLE CONTATOS
 * Fluxo: usuário toca "Adicionar" nos contatos compartilhados pelo
 * WhatsApp (isso salva no Google Contatos do celular) e depois usa
 * este botão pra trazer os contatos recentes pra dentro do app,
 * sem precisar de computador nem Excel.
 * ------------------------------------------------------------ */
let googleTokenClientContatos = null;
let tokenGoogleContatosAtual = null;

/* ------------------------------------------------------------
 * IMPORTAÇÃO VIA PLANILHA EXCEL (.xlsx/.xls/.csv)
 * Pensada pra grupos de WhatsApp com centenas de contatos: a
 * planilha já traz nome, telefone, indicado por e profissão
 * prontos, linha por linha — sem precisar preencher nada na tela.
 * ------------------------------------------------------------ */
function normalizarCabecalho(texto){
  return texto
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // remove acentos
    .toLowerCase()
    .replace(/[^a-z]/g, ""); // remove espaços, underscores, etc.
}

function iniciarImportarPlanilha(){
  document.getElementById("inputArquivoExcelLote").click();
}

async function processarArquivoExcelLote(arquivo){
  if(!arquivo) return;

  try{
    const bytes = await arquivo.arrayBuffer();
    const pasta = XLSX.read(bytes, { type: "array" });
    const primeiraAba = pasta.Sheets[pasta.SheetNames[0]];
    const linhas = XLSX.utils.sheet_to_json(primeiraAba, { defval: "" });

    if(linhas.length === 0){
      mostrarToast("A planilha está vazia.");
      return;
    }

    // Mapeia os cabeçalhos da planilha (com variações de acento/espaço)
    // pras chaves internas que usamos.
    const cabecalhos = Object.keys(linhas[0]);
    const mapa = {};
    for(const cab of cabecalhos){
      const normalizado = normalizarCabecalho(cab);
      if(normalizado === "nome") mapa.nome = cab;
      else if(normalizado === "telefone") mapa.telefone = cab;
      else if(normalizado === "indicadopor") mapa.indicadoPor = cab;
      else if(normalizado === "profissao") mapa.profissao = cab;
      else if(normalizado === "observacao" || normalizado === "observacaocontato" || normalizado === "observacoes") mapa.observacao = cab;
    }

    if(!mapa.telefone){
      mostrarToast('A planilha precisa ter uma coluna "Telefone".');
      return;
    }

    const telefonesJaNaLista = new Set(estado.importarLoteContatos.map(c => c.telefone.replace(/\D/g, "")));
    let adicionados = 0;
    let semTelefone = 0;

    for(const linha of linhas){
      const telefoneBruto = String(linha[mapa.telefone] || "").trim();
      if(!telefoneBruto){ semTelefone++; continue; }

      const somenteDigitos = telefoneBruto.replace(/\D/g, "");
      if(somenteDigitos.length < 8){ semTelefone++; continue; }
      if(telefonesJaNaLista.has(somenteDigitos)) continue;

      estado.importarLoteContatos.push({
        nome: mapa.nome ? String(linha[mapa.nome] || "").trim() : "",
        telefone: telefoneBruto,
        profissao: mapa.profissao ? String(linha[mapa.profissao] || "").trim() : "",
        observacao: mapa.observacao ? String(linha[mapa.observacao] || "").trim() : "",
        indicadoPor: mapa.indicadoPor ? String(linha[mapa.indicadoPor] || "").trim() : "",
        googleResourceName: null
      });
      telefonesJaNaLista.add(somenteDigitos);
      adicionados++;
    }

    mostrarToast(`${adicionados} contato${adicionados === 1 ? "" : "s"} da planilha adicionado${adicionados === 1 ? "" : "s"} à lista`
      + (semTelefone > 0 ? ` (${semTelefone} sem telefone válido, ignorado${semTelefone === 1 ? "" : "s"})` : ""));

    renderTelaImportarLote();
  }catch(err){
    mostrarToast("Erro ao ler a planilha: " + err.message);
  }
}

function iniciarImportarGoogleContatos(){
  if(GOOGLE_CLIENT_ID.startsWith("COLE_AQUI")){
    mostrarToast("Configuração do Google Contatos ainda não foi concluída.");
    return;
  }
  if(typeof google === "undefined" || !google.accounts || !google.accounts.oauth2){
    mostrarToast("Não foi possível carregar o login do Google. Verifique sua internet e tente novamente.");
    return;
  }

  estado.importarLoteCarregandoGoogle = true;
  renderTelaImportarLote();

  if(!googleTokenClientContatos){
    googleTokenClientContatos = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_CONTACTS_SCOPE,
      callback: (resposta) => {
        if(resposta && resposta.access_token){
          buscarContatosGoogle(resposta.access_token);
        } else {
          estado.importarLoteCarregandoGoogle = false;
          mostrarToast("Não foi possível conectar ao Google Contatos.");
          renderTelaImportarLote();
        }
      }
    });
  }

  googleTokenClientContatos.requestAccessToken();
}

async function buscarContatosGoogle(accessToken){
  try{
    const url = "https://people.googleapis.com/v1/people/me/connections"
      + "?personFields=names,phoneNumbers,metadata"
      + "&sortOrder=LAST_MODIFIED_DESCENDING"
      + "&pageSize=100";

    const resposta = await fetch(url, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });

    if(!resposta.ok) throw new Error("Falha na consulta ao Google Contatos (" + resposta.status + ")");

    const dados = await resposta.json();
    const pessoas = dados.connections || [];

    const telefonesJaNaLista = new Set(estado.importarLoteContatos.map(c => c.telefone.replace(/\D/g, "")));
    const limiteRecencia = Date.now() - (DIAS_RECENCIA_GOOGLE_CONTATOS * 24 * 60 * 60 * 1000);
    let adicionados = 0;

    for(const pessoa of pessoas){
      const nomeCompleto = (pessoa.names && pessoa.names[0] && pessoa.names[0].displayName) || "";

      // Contatos pessoais (marcados com o caractere de proteção) são
      // ignorados. Todo o resto — a maioria, sem marcação nenhuma —
      // é considerado de trabalho e entra na busca.
      if(nomeCompleto.trim().endsWith(MARCADOR_CONTATO_PESSOAL)) continue;

      // Proteção contra varrer contatos antigos: só considera quem foi
      // salvo/alterado recentemente (a API não expõe "data de criação"
      // separada, então usamos a data de modificação mais recente entre
      // as fontes do contato).
      const fontes = (pessoa.metadata && pessoa.metadata.sources) || [];
      const dataMaisRecente = fontes.reduce((maisRecente, fonte) => {
        const t = fonte.updateTime ? new Date(fonte.updateTime).getTime() : 0;
        return t > maisRecente ? t : maisRecente;
      }, 0);
      if(dataMaisRecente < limiteRecencia) continue;

      const nome = nomeCompleto.trim();
      const telefoneBruto = pessoa.phoneNumbers && pessoa.phoneNumbers[0] && pessoa.phoneNumbers[0].value;
      if(!telefoneBruto) continue;

      const somenteDigitos = telefoneBruto.replace(/\D/g, "");
      if(somenteDigitos.length < 8) continue;
      if(telefonesJaNaLista.has(somenteDigitos)) continue;

      estado.importarLoteContatos.push({
        nome,
        telefone: telefoneBruto,
        profissao: "",
        observacao: "",
        googleResourceName: pessoa.resourceName || null
      });
      telefonesJaNaLista.add(somenteDigitos);
      adicionados++;
    }

    // Guarda o token em memória (não persiste, some ao recarregar a página)
    // pra poder excluir os contatos do Google depois da importação confirmada.
    if(adicionados > 0) tokenGoogleContatosAtual = accessToken;

    mostrarToast(adicionados > 0
      ? `${adicionados} contato${adicionados === 1 ? "" : "s"} marcado${adicionados === 1 ? "" : "s"} trazido${adicionados === 1 ? "" : "s"} do Google Contatos`
      : "Nenhum contato novo de trabalho foi encontrado");
  }catch(err){
    mostrarToast("Erro ao buscar contatos do Google: " + err.message);
  }finally{
    estado.importarLoteCarregandoGoogle = false;
    renderTelaImportarLote();
  }
}

/* Exclui um contato do Google (chamado só depois que ele já foi salvo
   com sucesso no CRM). Falhas aqui não interrompem a importação —
   o contato já está seguro no sistema de qualquer forma. */
async function excluirContatoDoGoogle(resourceName){
  if(!resourceName || !tokenGoogleContatosAtual) return false;
  try{
    const resposta = await fetch(
      `https://people.googleapis.com/v1/${resourceName}:deleteContact`,
      { method: "DELETE", headers: { Authorization: `Bearer ${tokenGoogleContatosAtual}` } }
    );
    return resposta.ok;
  }catch(err){
    return false;
  }
}

async function confirmarImportacaoLote(){
  if(estado.importarLoteContatos.length === 0) return;

  estado.importarLoteEnviando = true;
  estado.importarLoteProgresso = 0;
  renderTelaImportarLote();

  let sucesso = 0;
  let erros = 0;
  let excluidosDoGoogle = 0;

  for(const contato of estado.importarLoteContatos){
    try{
      await apiCriar(ABA_CONTATOS, {
        NOME: contato.nome || "",
        TELEFONE: contato.telefone,
        INDICADO_POR: contato.indicadoPor || estado.importarLoteIndicadoPor || "",
        OBSERVACAO_INDICADO: estado.importarLoteObservacaoIndicadoPor || "",

        OBSERVACAO: contato.observacao || "",
        STATUS_COMERCIAL: "",

      });
      sucesso++;

      if(contato.googleResourceName){
        const excluiu = await excluirContatoDoGoogle(contato.googleResourceName);

      }
    }catch(err){

    estado.importarLoteProgresso++;
    renderTelaImportarLote();
  }

  estado.importarLoteEnviando = false;
  mostrarToast(`Importação concluída: ${sucesso} adicionado${sucesso === 1 ? "" : "s"}${erros > 0 ? `, ${erros} com erro` : ""}${excluidosDoGoogle > 0 ? ` (${excluidosDoGoogle} removido${excluidosDoGoogle === 1 ? "" : "s"} do Google Contatos)` : ""}`);

  fecharImportarLote();
  await carregarContatos();
  await mesclarTodosDuplicados({ silencioso: true, pularConfirmacao: true });
}

/* Detecta se o cursor está logo depois de um "@" (com ou sem letras
   já digitadas depois), pra oferecer o atalho de tags. */
function detectarAtalhoTag(textarea){
  const valor = textarea.value;
  const pos = textarea.selectionStart;
  const antesCursor = valor.substring(0, pos);
  const match = antesCursor.match(/@([a-zA-Z_]*)$/);
  if(!match) return null;
  return { termo: match[1].toLowerCase(), inicio: pos - match[0].length, fim: pos };
}

function mostrarAutocompleteTags(id, textarea, deteccao){
  const popup = document.getElementById("autocompleteTags_" + id);
  if(!popup) return;

  const opcoes = TAGS_MENSAGEM_DISPONIVEIS.filter(t => t.chave.startsWith(deteccao.termo));
  if(opcoes.length === 0){ popup.style.display = "none"; return; }

  popup.innerHTML = opcoes.map(o => `<button type="button" class="autocomplete-tag-item" data-chave="${o.chave}">${o.rotulo}</button>`).join("");
  popup.style.display = "block";

  popup.querySelectorAll(".autocomplete-tag-item").forEach(btn => {
    // mousedown (não click) pra disparar antes do blur do textarea
    btn.addEventListener("mousedown", (e) => {
      e.preventDefault();
      const chave = btn.dataset.chave;
      const valorAtual = textarea.value;
      const novoValor = valorAtual.substring(0, deteccao.inicio) + "{" + chave + "}" + valorAtual.substring(deteccao.fim);
      textarea.value = novoValor;
      atualizarMensagemWhatsapp(id, { texto: novoValor });
      popup.style.display = "none";
      textarea.focus();
      const novaPosicao = deteccao.inicio + chave.length + 2;
      textarea.setSelectionRange(novaPosicao, novaPosicao);
    });
  });
}

function fecharAutocompleteTags(id){
  const popup = document.getElementById("autocompleteTags_" + id);
  if(popup) popup.style.display = "none";
}

function renderTelaAgenda(){
  const sheet = document.getElementById("sheet");
  const pendentes = contatosAgendadosSemSincronizar().length;

  sheet.innerHTML = `

            : "Todos os agendamentos já têm evento no Google Agenda."}
        </p>
        <button class="btn ghost" id="btnSincronizarAgendamentos" style="width:100%;" ${sincronizandoAgendamentosGoogle ? "disabled" : ""}>
          ${sincronizandoAgendamentosGoogle ? "Sincronizando..." : "Sincronizar Google Agenda"}
        </button>
      </div>
    </div>
  `;

  document.getElementById("fecharSheet").addEventListener("click", fecharTelaAgenda);
  document.getElementById("btnSincronizarAgendamentos").addEventListener("click", async () => {
    await sincronizarTodosAgendamentosComGoogle();

  });

function contatosAgendadosSemSincronizar(){
  return estado.contatos.filter(c => c.AGENDAMENTO && !c.ID_EVENTO_AGENDA);
}

let sincronizandoAgendamentosGoogle = false;

async function sincronizarTodosAgendamentosComGoogle(){
  if(sincronizandoAgendamentosGoogle) return;

  const pendentes = contatosAgendadosSemSincronizar();
  if(pendentes.length === 0){
    mostrarToast("Nenhum agendamento pendente de sincronizar.");
    return;
  }

  sincronizandoAgendamentosGoogle = true;
  renderTelaAgenda();

  let sucesso = 0;
  let erros = 0;

  for(const c of pendentes){
    try{
      const dataHoraIso = brDataHoraParaInputValue(c.AGENDAMENTO);
      const eventoId = await criarOuAtualizarEventoAgenda(c, dataHoraIso);
      if(eventoId){
        c.ID_EVENTO_AGENDA = eventoId;
        await apiAtualizar(c.aba, c.linha, { ID_EVENTO_AGENDA: eventoId });
        sucesso++;
      }
    }catch(err){
      erros++;
    }
  }

  sincronizandoAgendamentosGoogle = false;
  salvarCacheLocal();
  mostrarToast(`Sincronização concluída: ${sucesso} agendamento${sucesso === 1 ? "" : "s"} enviado${sucesso === 1 ? "" : "s"} pro Google Agenda${erros > 0 ? `, ${erros} com erro` : ""}`);
}

async function substituirValorEmMassaConfig(chaveApp){
  const selectDe = document.getElementById("substituirDe-" + chaveApp);
  const selectPara = document.getElementById("substituirPara-" + chaveApp);
  const de = selectDe.value;
  const para = selectPara.value;

  if(de === para){
    mostrarToast("Escolha duas opções diferentes.");
    return;
  }

  let quantidade = 0;
  try{
    quantidade = await apiContarUsoOpcao(chaveApp, de);
  }catch(err){
    mostrarToast("Erro ao verificar quantos contatos seriam afetados: " + err.message);
    return;
  }

  if(quantidade === 0){
    mostrarToast(`Nenhum contato está com "${de}" no momento.`);
    return;
  }

  const confirmou = confirm(`Trocar "${de}" por "${para}" em ${quantidade} contato${quantidade === 1 ? "" : "s"}? Essa ação não pode ser desfeita.`);
  if(!confirmou) return;

  try{
    await apiSubstituirValorEmMassa(chaveApp, de, para);

    // Atualiza em memória também, sem precisar recarregar tudo do banco
    const campoContato = CHAVE_APP_CONTATO_POR_OPCAO[chaveApp];
    estado.contatos.forEach(c => {
      if(c[campoContato] === de) c[campoContato] = para;
    });
    salvarCacheLocal();

    mostrarToast(`${quantidade} contato${quantidade === 1 ? "" : "s"} atualizado${quantidade === 1 ? "" : "s"}`);
    renderListaEContagem();
  }catch(err){
    mostrarToast("Erro ao substituir: " + err.message);
  }
}

async function adicionarOpcaoConfig(chaveApp, input){
  const valor = input.value.trim();
  if(valor === "") return;

  try{
    await apiAdicionarOpcao(chaveApp, valor);
    if(!estado.opcoes[chaveApp].includes(valor)){
      estado.opcoes[chaveApp].push(valor);
      estado.opcoes[chaveApp].sort((a,b) => a.localeCompare(b));
    }
    input.value = "";
    renderTelaManutencao();
    mostrarToast("Opção adicionada");
  }catch(err){
    mostrarToast("Erro ao adicionar: " + err.message);
  }
}

async function abrirModalExcluirOpcao(chaveApp, valor){
  let quantidadeEmUso = 0;
  try{
    quantidadeEmUso = await apiContarUsoOpcao(chaveApp, valor);
  }catch(err){
    mostrarToast("Erro ao verificar uso da opção: " + err.message);
    return;
  }

  const outrasOpcoes = (estado.opcoes[chaveApp] || []).filter(o => o !== "" && o !== valor);

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalExcluirOpcao";
  overlay.innerHTML = `
    <div class="modal-caixa">
      <h3>Excluir opção "${escapeAttr(valor)}"?</h3>
      ${quantidadeEmUso > 0 ? `
        <p>Essa opção está atribuída a <b>${quantidadeEmUso}</b> contato${quantidadeEmUso === 1 ? "" : "s"}. Escolha pra qual opção transferir esses contatos, ou deixe em branco:</p>
        <select id="selectNovaOpcao">
          <option value="">(deixar em branco)</option>
          ${outrasOpcoes.map(o => `<option value="${escapeAttr(o)}">${escapeAttr(o)}</option>`).join("")}
        </select>
      ` : `<p>Essa opção não está em uso por nenhum contato no momento.</p>`}
      <div class="modal-acoes">
        <button class="btn ghost" id="cancelarExclusaoOpcao">Cancelar</button>
        <button class="btn danger" id="confirmarExclusaoOpcao">Excluir</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById("cancelarExclusaoOpcao").addEventListener("click", () => overlay.remove());

  document.getElementById("confirmarExclusaoOpcao").addEventListener("click", async () => {
    const selectNovaOpcao = document.getElementById("selectNovaOpcao");
    const novoValor = selectNovaOpcao ? selectNovaOpcao.value : "";

    try{
      await apiExcluirOpcao(chaveApp, valor, novoValor);

      // Atualiza os contatos já carregados em memória, sem precisar
      // recarregar tudo da rede.
      const campoDb = { referidos: "REFERIDOS", statusComercial: "STATUS_COMERCIAL", statusComportamental: "STATUS_COMPORTAMENTAL", profissao: "PROFISSAO" }[chaveApp];
      estado.contatos.forEach(c => {
        if(c[campoDb] === valor) c[campoDb] = novoValor || "";
      });

      estado.opcoes[chaveApp] = (estado.opcoes[chaveApp] || []).filter(o => o !== valor);

      overlay.remove();
      renderTelaManutencao();
      renderListaEContagem();
      mostrarToast("Opção excluída" + (quantidadeEmUso > 0 ? " e contatos atualizados" : ""));
    }catch(err){
      mostrarToast("Erro ao excluir: " + err.message);
    }
  });
}

/* ============================================================
 * EXPORTAR CONTATOS EM PLANILHA (.csv)
 * ============================================================ */
const COLUNAS_EXPORTACAO = [
  { chave: "NOME", rotulo: "Nome", transformar: c => capitalizarPrimeiraLetra(primeiroNomeDe(c.NOME)) },
  { chave: "TELEFONE", rotulo: "Telefone" },
  { chave: "INDICADO_POR", rotulo: "Indicado por" },
  { chave: "STATUS_COMERCIAL", rotulo: "Status Comercial" },
  { chave: "STATUS_COMPORTAMENTAL", rotulo: "Status do Contato" },
  { chave: "REFERIDOS", rotulo: "Referido" },
  { chave: "PROFISSAO", rotulo: "Profissão" },
  { chave: "FUSO", rotulo: "Fuso" },
  { chave: "PAIS", rotulo: "País" },
  { chave: "REGIAO", rotulo: "Região" },
  { chave: "OBSERVACAO", rotulo: "Observação do Contato" },
  { chave: "OBSERVACAO_INDICADO", rotulo: "Observação do Indicado por" },
  { chave: "REGISTRO_TELEFONE", rotulo: "Data do Telefone" },
  { chave: "REGISTRO_STATUS_COMERCIAL", rotulo: "Data do Status Comercial" },
  { chave: "REGISTRO_STATUS_COMPORTAMENTAL", rotulo: "Data do Status do Contato" },
  { chave: "AGENDAMENTO", rotulo: "Agendamento" }
];

function escaparCampoCsv(valor){
  const texto = String(valor === null || valor === undefined ? "" : valor);
  if(texto.indexOf(";") !== -1 || texto.indexOf("\"") !== -1 || texto.indexOf("\n") !== -1){
    return '"' + texto.replace(/"/g, '""') + '"';
  }
  return texto;
}

function gerarEBaixarCsvDeContatos(listaOriginal, sufixoNomeArquivo){
  if(!listaOriginal || listaOriginal.length === 0){
    mostrarToast("Nenhum contato pra exportar com esse filtro.");
    return;
  }

  // Remove telefones duplicados da planilha exportada — mantém só o
  // primeiro contato de cada número (a base de dados em si não é
  // alterada, isso afeta só o arquivo baixado).
  const telefonesJaVistos = new Set();
  const lista = listaOriginal.filter(c => {
    const digitos = String(c.TELEFONE || "").replace(/\D/g, "");
    if(digitos === "") return true; // sem telefone, não dá pra comparar — mantém
    if(telefonesJaVistos.has(digitos)) return false;
    telefonesJaVistos.add(digitos);
    return true;
  });

  const cabecalho = COLUNAS_EXPORTACAO.map(c => c.rotulo).join(";");
  const linhasCsv = lista.map(c =>
    COLUNAS_EXPORTACAO.map(col => escaparCampoCsv(col.transformar ? col.transformar(c) : c[col.chave])).join(";")
  );

  // ";" como separador (padrão do Excel em português) + BOM UTF-8 no
  // início, pra acentos aparecerem corretos ao abrir no Excel.
  const conteudo = "\uFEFF" + cabecalho + "\n" + linhasCsv.join("\n");

  const blob = new Blob([conteudo], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const dataHoje = new Date();
  const pad = n => String(n).padStart(2, "0");
  const nomeArquivo = `contatos-matriculas-${sufixoNomeArquivo}-${dataHoje.getFullYear()}${pad(dataHoje.getMonth()+1)}${pad(dataHoje.getDate())}.csv`;

  const link = document.createElement("a");
  link.href = url;
  link.download = nomeArquivo;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  mostrarToast(`Planilha baixada (${lista.length} contato${lista.length === 1 ? "" : "s"})`);
}

function baixarPlanilhaDeContatos(){
  gerarEBaixarCsvDeContatos(estado.contatos, "todos");
}

function baixarPlanilhaFiltrada(){
  gerarEBaixarCsvDeContatos(contatosFiltradosFinal(), "filtro");
}

async function rodarFuncaoManutencao(chave){
  if(estado.manutencaoRodando) return;

  const def = LISTA_FUNCOES_MANUTENCAO.find(f => f.chave === chave);
  estado.manutencaoRodando = chave;
  renderTelaManutencao();

  try{
    const resultado = await apiManutencao(chave);
    estado.manutencaoRodando = "";
    estado.manutencaoResultado = { rotulo: def ? def.rotulo : chave, texto: resultado.mensagem || "Concluído." };
    renderTelaManutencao();
    // Algumas dessas funções podem ter alterado dados — atualiza a
    // lista em segundo plano pra refletir o que mudou.
    carregarContatos();
  }catch(err){

    estado.manutencaoResultado = { rotulo: def ? def.rotulo : chave, texto: "Erro: " + err.message };
    renderTelaManutencao();
  }
}

/* Campos "categóricos" fazem sentido pra gráfico de barras — reaproveita
   os mesmos 9 campos já usados nos filtros da tela inicial. */
const CAMPOS_RELATORIO = CAMPOS_FILTRO;

/* Conta quantos contatos existem por valor de um campo, dentro de
   uma lista qualquer (usado pelo Relatório — não depende do estado
   global de filtros, ao contrário de opcoesDisponiveis). */
function contarValoresPorCampo(lista, chave){
  const mapa = {};
  lista.forEach(c => {
    const v = valorOuBranco(c[chave]);
    mapa[v] = (mapa[v] || 0) + 1;
  });
  return mapa;
}

/* Mapa campo-de-relatório -> qual coluna de data usar como período
   (cada campo do relatório tem sua própria data de referência,
   independente dos outros — por isso o período é salvo por campo). */
const DATA_REFERENCIA_POR_CAMPO = {
  STATUS_COMERCIAL: "REGISTRO_STATUS_COMERCIAL",
  STATUS_COMPORTAMENTAL: "REGISTRO_STATUS_COMPORTAMENTAL",
  REFERIDOS: "REGISTRO_TELEFONE",
  FUSO: "REGISTRO_TELEFONE",
  PAIS: "REGISTRO_TELEFONE",
  REGIAO: "REGISTRO_TELEFONE",
  PROFISSAO: "REGISTRO_TELEFONE"
};

/* Período salvo por campo — cada campo lembra seu próprio intervalo. */
if(!estado.relatorioPeriodos){
  estado.relatorioPeriodos = {};
  CAMPOS_RELATORIO.forEach(f => { estado.relatorioPeriodos[f.chave] = { inicio: "", fim: "" }; });
}

function filtrarPorPeriodo(lista, chaveCampoData, inicioIso, fimIso){
  if(!inicioIso && !fimIso) return lista;
  return lista.filter(c => {
    const dataStr = String(c[chaveCampoData] || "").substring(0, 10); // dd/MM/yyyy
    const m = dataStr.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if(!m) return false;
    const dataIso = m[3] + "-" + m[2] + "-" + m[1];
    if(inicioIso && dataIso < inicioIso) return false;
    if(fimIso && dataIso > fimIso) return false;
    return true;
  });
}

/* Cores usadas nas fatias/barras/linha do gráfico, em sequência */
const CORES_GRAFICO = ["#123832","#DD0897","#1D5C9E","#8A6414","#1C6B3C","#A23B2E","#146356","#9E3866","#63676C","#2B6E8A"];

/* Estado do gráfico do relatório — lembrado entre aberturas */
if(estado.relatorioMostrarGrafico === undefined) estado.relatorioMostrarGrafico = false;
if(estado.relatorioTipoGrafico === undefined) estado.relatorioTipoGrafico = "barra";
if(estado.relatorioVerPorDia === undefined) estado.relatorioVerPorDia = false;
if(estado.relatorioValoresSelecionados === undefined) estado.relatorioValoresSelecionados = {};

/* Quais valores do campo atual o usuário escolheu ver (vazio = ver
   todos, igual já era o comportamento padrão). */
function obterSelecaoValoresRelatorio(chaveCampo){
  if(!estado.relatorioValoresSelecionados[chaveCampo]){
    estado.relatorioValoresSelecionados[chaveCampo] = new Set();
  }
  return estado.relatorioValoresSelecionados[chaveCampo];
}

/* Agrupa os dados já filtrados por período (e, se houver, pelos
   valores escolhidos) por valor do campo (padrão) ou por dia (usando
   a mesma coluna de data do período), pra responder "o que aconteceu
   em cada dia". */
function gerarEntradasRelatorio(dados, campo, chaveData, porDia){
  if(porDia){
    const mapa = {};
    dados.forEach(c => {
      const dataStr = String(c[chaveData] || "").substring(0, 10);
      if(!/^\d{2}\/\d{2}\/\d{4}$/.test(dataStr)) return;
      mapa[dataStr] = (mapa[dataStr] || 0) + 1;
    });
    return Object.keys(mapa)
      .map(k => ({ label: k, valor: mapa[k], _iso: k.split("/").reverse().join("-") }))
      .sort((a, b) => a._iso.localeCompare(b._iso));
  }
  const contagem = contarValoresPorCampo(dados, campo.chave);
  return Object.keys(contagem)
    .map(k => ({ label: k, valor: contagem[k] }))
    .sort((a, b) => b.valor - a.valor);
}

/* Monta o HTML do gráfico (barra, pizza ou linha), com % de cada
   fatia dentro do total do período selecionado. */
function renderGraficoHtml(entradas, total, tipo){
  if(entradas.length === 0){
    return `<p style="color:var(--ink-faint);font-size:13px;text-align:center;padding:16px 0;">Nenhum dado pra mostrar no gráfico.</p>`;
  }

  if(tipo === "pizza"){
    let acumulado = 0;
    const fatias = entradas.map((e, i) => {
      const pctIni = total > 0 ? (acumulado / total * 100) : 0;
      acumulado += e.valor;
      const pctFim = total > 0 ? (acumulado / total * 100) : 0;
      const cor = CORES_GRAFICO[i % CORES_GRAFICO.length];
      return `${cor} ${pctIni.toFixed(2)}% ${pctFim.toFixed(2)}%`;
    }).join(", ");

    const legenda = entradas.map((e, i) => {
      const pct = total > 0 ? Math.round(e.valor / total * 100) : 0;
      const cor = CORES_GRAFICO[i % CORES_GRAFICO.length];
      return `<div class="grafico-legenda-item"><span class="grafico-legenda-cor" style="background:${cor}"></span><span class="grafico-legenda-label">${e.label}</span><span class="grafico-legenda-valor">${e.valor} (${pct}%)</span></div>`;
    }).join("");

    return `
      <div class="grafico-pizza-wrap">
        <div class="grafico-pizza" style="background: conic-gradient(${fatias});"></div>
        <div class="grafico-legenda">${legenda}</div>
      </div>
    `;
  }

  if(tipo === "linha"){
    const maxValor = Math.max.apply(null, entradas.map(e => e.valor));
    const larguraSvg = Math.max(entradas.length * 64, 260);
    const alturaSvg = 180;
    const margemBaixo = 34;
    const margemTopo = 16;
    const areaUtil = alturaSvg - margemBaixo - margemTopo;

    const pontos = entradas.map((e, i) => {
      const x = entradas.length === 1 ? larguraSvg / 2 : (i / (entradas.length - 1)) * (larguraSvg - 40) + 20;
      const y = maxValor > 0 ? margemTopo + areaUtil - (e.valor / maxValor) * areaUtil : margemTopo + areaUtil;
      return { x, y, e };
    });

    const linhaPath = pontos.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    const cor = CORES_GRAFICO[1]; // rosa — cor única, já que é uma evolução ao longo do tempo/valores

    const circulos = pontos.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${cor}"/>`).join("");
    const valores = pontos.map(p => `<text x="${p.x.toFixed(1)}" y="${(p.y - 9).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">${p.e.valor}</text>`).join("");
    const labels = pontos.map(p => `<text x="${p.x.toFixed(1)}" y="${alturaSvg - 12}" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">${escapeAttr(p.e.label.length > 9 ? p.e.label.slice(0,8) + "…" : p.e.label)}</text>`).join("");

    return `
      <div class="grafico-linha-wrap">
        <svg viewBox="0 0 ${larguraSvg} ${alturaSvg}" width="${larguraSvg}" height="${alturaSvg}" style="min-width:${larguraSvg}px;">
          <path d="${linhaPath}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
          ${circulos}
          ${valores}
          ${labels}
        </svg>
      </div>
    `;
  }

  const maxValor = Math.max.apply(null, entradas.map(e => e.valor));
  const barras = entradas.map((e, i) => {
    const alturaPct = maxValor > 0 ? Math.max(Math.round(e.valor / maxValor * 100), 4) : 4;
    const cor = CORES_GRAFICO[i % CORES_GRAFICO.length];
    const pct = total > 0 ? Math.round(e.valor / total * 100) : 0;
    return `
      <div class="grafico-barra-col">
        <div class="grafico-barra-valor">${e.valor}</div>
        <div class="grafico-barra-corpo" style="height:${alturaPct}%;background:${cor};"></div>
        <div class="grafico-barra-pct">${pct}%</div>
        <div class="grafico-barra-label" title="${e.label}">${e.label}</div>
      </div>
    `;
  }).join("");

  return `<div class="grafico-barras-wrap">${barras}</div>`;
}

  const chaveData = DATA_REFERENCIA_POR_CAMPO[campo.chave];
  const periodo = estado.relatorioPeriodos[campo.chave];
  const selecaoValores = obterSelecaoValoresRelatorio(campo.chave);

  const base = contatosFiltradosFinal();
  const dadosPeriodo = filtrarPorPeriodo(base, chaveData, periodo.inicio, periodo.fim);

  // Todas as opções existentes nesse campo dentro do período — usadas
  // pra montar a lista de valores que dá pra escolher.
  const todosOsValoresDoPeriodo = Object.keys(contarValoresPorCampo(dadosPeriodo, campo.chave)).sort();

  // Se o usuário escolheu um ou mais valores específicos, só eles
  // entram na lista/gráfico — o "total" do resumo continua sendo o

  const dados = selecaoValores.size > 0

  const contagem = contarValoresPorCampo(dados, campo.chave);

  const entradas = Object.keys(contagem)
    .map(k => ({ label: k, valor: contagem[k] }))
    .sort((a, b) => b.valor - a.valor);

  const maxValor = entradas.length ? entradas[0].valor : 0;

  sheet.innerHTML = `

          <input type="date" id="relatorioDataFim" value="${periodo.fim}">

        <div class="relatorio-selecao-valores">
          <div class="k">Mostrar só estas opções (opcional)</div>
          <div class="relatorio-valores-chips">
            ${todosOsValoresDoPeriodo.map(v => `

            `).join("")}
          </div>
          ${selecaoValores.size > 0 ? `<button class="link-limpar" id="limparSelecaoValores">Limpar seleção</button>` : ""}
        </div>

      <div class="relatorio-barras">

        ` : entradas.map((e, i) => {

            </div>

      </div>

    renderTelaRelatorio();
  });
  document.getElementById("relatorioDataInicio").addEventListener("change", (e) => {
    estado.relatorioPeriodos[campo.chave].inicio = e.target.value;
    renderTelaRelatorio();
  });
  document.getElementById("relatorioDataFim").addEventListener("change", (e) => {
    estado.relatorioPeriodos[campo.chave].fim = e.target.value;
    renderTelaRelatorio();
  });
  document.getElementById("graficoMostrar").addEventListener("change", (e) => {
    estado.relatorioMostrarGrafico = e.target.checked;
    renderTelaRelatorio();
  });
  const btnPorDia = document.getElementById("graficoPorDia");
  if(btnPorDia){
    btnPorDia.addEventListener("change", (e) => {
      estado.relatorioVerPorDia = e.target.checked;
      renderTelaRelatorio();
    });
  }
  document.querySelectorAll("[data-tipo-grafico]").forEach(btn => {
    btn.addEventListener("click", () => {
      estado.relatorioTipoGrafico = btn.dataset.tipoGrafico;
      renderTelaRelatorio();
    });
  });
  document.querySelectorAll("[data-valor-relatorio]").forEach(btn => {
    btn.addEventListener("click", () => {
      const valor = btn.dataset.valorRelatorio;
      if(selecaoValores.has(valor)) selecaoValores.delete(valor);
      else selecaoValores.add(valor);
      renderTelaRelatorio();
    });
  });
  const btnLimparSelecao = document.getElementById("limparSelecaoValores");
  if(btnLimparSelecao){
    btnLimparSelecao.addEventListener("click", () => {
      selecaoValores.clear();
      renderTelaRelatorio();
    });
  }
}

/* ============================================================
 * SHEET — adicionar contato novo (botão "+")
 * ============================================================ */
function abrirNovoContato(){
  estado.salvandoNovo = false;
  estado.erroNovo = "";
  renderNovoContato();
  abrirSheetElemento();
}

function renderNovoContato(){
  const sheet = document.getElementById("sheet");

  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h3>Novo contato</h3><button class="close" id="fecharSheet">✕</button></div>
    <div class="sheet-body" id="corpoNovoContato">
      ${estado.erroNovo ? `<div class="aviso-erro">${estado.erroNovo}</div>` : ""}

      <div class="detail-field">
        <div class="k">Nome</div>
        <input type="text" id="novoContatoNome" placeholder="Nome da pessoa">
      </div>

      <div class="detail-field">
        <div class="k">Telefone *</div>
        <input type="text" id="novoContatoTelefone" placeholder="+55 21 99999-9999">
      </div>

      <div class="detail-field">
        <div class="k">Observação do Contato</div>
        <input type="text" id="novoContatoObservacao" placeholder="Observações sobre o contato">
      </div>

      <div class="detail-field">
        <div class="k">Indicado por</div>
        <input type="text" id="novoContatoIndicado" placeholder="Quem indicou">
      </div>

      <div class="detail-field">
        <div class="k">Observação do Indicado por</div>
        <input type="text" id="novoContatoObservacaoIndicado" placeholder="Observações sobre quem indicou">
      </div>

      <div class="detail-field">
        <div class="k">Status Comercial</div>
        <select id="novoContatoStatusComercial">
          ${(estado.opcoes.statusComercial || [""]).map(o => `<option value="${o}">${o === "" ? "(em branco)" : o}</option>`).join("")}
        </select>
      </div>

      <div class="detail-field">
        <div class="k">Status do Contato</div>
        <select id="novoContatoStatusContato">
          ${(estado.opcoes.statusComportamental || [""]).map(o => `<option value="${o}">${o === "" ? "(em branco)" : o}</option>`).join("")}
        </select>
      </div>

      <div class="detail-field">
        <div class="k">Profissão</div>
        <input type="text" id="novoContatoProfissao" list="listaProfissoesNovo" placeholder="Digite ou escolha uma opção existente">
        <datalist id="listaProfissoesNovo">
          ${(estado.opcoes.profissao || []).filter(o => o !== "").map(o => `<option value="${escapeAttr(o)}"></option>`).join("")}
        </datalist>
      </div>

      <div class="detail-field">
        <div class="k">Referido</div>
        <select id="novoContatoReferido">
          ${(estado.opcoes.referidos || [""]).map(o => `<option value="${o}">${o === "" ? "(em branco)" : o}</option>`).join("")}
        </select>
      </div>

      <div class="detail-field">
        <div class="k">Agendamento</div>
        <input type="datetime-local" id="novoContatoAgendamento">
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn ghost" id="cancelarNovoContato" ${estado.salvandoNovo ? "disabled" : ""}>Cancelar</button>
      <button class="btn primary" id="salvarNovoContato" ${estado.salvandoNovo ? "disabled" : ""}>${estado.salvandoNovo ? "Salvando..." : "Adicionar contato"}</button>
    </div>
  `;

  document.getElementById("fecharSheet").addEventListener("click", fecharSheet);
  document.getElementById("cancelarNovoContato").addEventListener("click", fecharSheet);
  document.getElementById("salvarNovoContato").addEventListener("click", salvarNovoContato);
}

async function salvarNovoContato(){
  if(estado.salvandoNovo) return;

  const aba = ABA_CONTATOS;
  const telefone = document.getElementById("novoContatoTelefone").value.trim();
  const nome = document.getElementById("novoContatoNome").value.trim();
  const observacao = document.getElementById("novoContatoObservacao").value.trim();
  const indicado = document.getElementById("novoContatoIndicado").value.trim();
  const observacaoIndicado = document.getElementById("novoContatoObservacaoIndicado").value.trim();
  const statusComercial = document.getElementById("novoContatoStatusComercial").value;
  const statusContato = document.getElementById("novoContatoStatusContato").value;
  const profissao = document.getElementById("novoContatoProfissao").value.trim();
  const referido = document.getElementById("novoContatoReferido").value;
  const agendamento = document.getElementById("novoContatoAgendamento").value;

  if(telefone === ""){
    estado.erroNovo = "Telefone é obrigatório.";
    renderNovoContato();
    return;
  }

  const dados = { TELEFONE: telefone };
  if(nome !== "") dados.NOME = nome;
  if(observacao !== "") dados.OBSERVACAO = observacao;
  if(indicado !== "") dados.INDICADO_POR = indicado;
  if(observacaoIndicado !== "") dados.OBSERVACAO_INDICADO = observacaoIndicado;
  if(statusComercial !== "") dados.STATUS_COMERCIAL = statusComercial;
  if(statusContato !== "") dados.STATUS_COMPORTAMENTAL = statusContato;
  if(profissao !== "") dados.PROFISSAO = profissao;
  if(referido !== "") dados.REFERIDOS = referido;

  estado.salvandoNovo = true;
  estado.erroNovo = "";
  renderNovoContato();

  try{
    const resultado = await apiCriar(aba, dados);

    // Se um agendamento foi escolhido no formulário, agenda logo em
    // seguida (mesmo caminho usado na tela de detalhes de um contato
    // já existente — cria o evento no Google Agenda e marca o status
    // comercial como AGENDADO).
    if(agendamento){
      try{
        await apiAgendar(aba, resultado.linha, agendamento);
      }catch(erroAgenda){
        // Contato já foi criado com sucesso — só avisa que o
        // agendamento em si não foi salvo, sem desfazer o contato.
        mostrarToast("Contato criado, mas o agendamento falhou: " + erroAgenda.message);
      }
    }

    const contatoCompleto = await apiDetalhe(aba, resultado.linha);
    estado.contatos.push(contatoCompleto);
    salvarCacheLocal();
    estado.salvandoNovo = false;
    fecharSheet();
    renderTudo();
    mostrarToast("Contato adicionado!");

    // Se esse telefone já existia em outro contato, mescla os dois
    // automaticamente, sem precisar de confirmação (o usuário já
    // decidiu cadastrar esse contato agora mesmo).
    mesclarTodosDuplicados({ silencioso: true, pularConfirmacao: true });
  }catch(err){
    estado.salvandoNovo = false;
    estado.erroNovo = "Não foi possível adicionar: " + err.message;
    renderNovoContato();
  }
}
